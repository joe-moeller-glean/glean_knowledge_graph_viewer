<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Enterprise Knowledge Graph Context Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />

<style>
  :root{
    --blue:#343CED;
    --green:#D8FD49;
    --oatmeal:#F6F3EB;
    --black:#000000;
    --white:#FFFFFF;

    --radius:20px;
    --brandMarkImg:url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIEAAACBCAYAAADnoNlQAAAM0klEQVR4nO1dT2wTVxr/3sw4hNQGut1FmDNkr0CSqqIx5NhukfayVFR7AilVD1sOqBzIYVF74NJdDnCpQEoui0Dk1BVbrkEGVClJw3WBcxy1ZLOLDUkTz7zV98Z2HHvGfm88f77nzE+qCrKZGc/7ve//9z0GuwQfTKyBvQnADQDOALjHdxj+xwGYA2AOAPw49y7sBuDv7htMTKxBpQoA3AGGi82ZWHDGvZZcDpwxlxiM42UBL5y1AOb6iCBM90V/bQOY4IADrKfFVgcTxECZYpqm1lJDOxKMjq/V/uQuAB0wV1pwAxYe60UIppOY54zHvNuDgdXeqmkaWkgIRn/XU9vxQSSEA/PF3wJVMKq7Hl+cBpteUTrQtB8YOcse0ATvXzB0T7kBlkXHBSVBgrHxNeB9vvieZHAAFp68B7uaBKjzGThaa/yw1ESSNgNLTPTbblAnxTYZkvImYifB+4VX4GAYLwUZqRDbaqS7n65UiIUEYyfXAMz+cvlikQq2DfNPD0Z/r6hvsBst/3ARfRjaiPLio4WUAL3DgbHCKmgnCdzAj+7hXmpgYFksEjuBRVK8Ud3dvr9uBqMROgHslABRAQ1rfL/4nkmSoEGAVARoR4RQSJASQG8iGGEYgakE0JsIPZMAvYBUBSQDfO/VKodjPRLB6DUOkLqBSYODJdzxBEggSr/SLCAR8KYC3JhIIHIBaSiYGBx4/9RaPCQQhoiZ5gIownGCGYrKJEg9AdpAQzFSEoiMYBoMEhg+agJd+2A1GhKgmElTwi7yeQPuTO/nly4OQS5Ls0pq7OTP4ZMgiJjpVwJ8d2OfeBmfnR3kd2b288P5SDPygcANS/q7Uk8/VniVxgNquHolC4cPbb+2/CED/jG9n5/5eA/QAofRD1fDIQGGhYm0JySOyfN7YeS41SYSUSVcnXqH4+ekwEAqmtiVBKIRNNUEgDv98wt7O74J/BxtBUrqIWN3d+c7Pq3rc6YxgXzegEsXh7is14A2AxXvATfw6PgvHb9jdYsJ6AxciBPHMvD7oyYMH7F4NsugeZculxyoVDgsrzjs+Ysq/PRsCxaXRENkA7kcE4uq4gWgnTByPAPPX2CHDQV0JiTrJAWqVf1IMHLcgtOFARTfSgtXR7nC4VFxkz0qbsFccRN1vbgWKODe7Ab7+423QAsOLDz+necnvm8JK1x1sgVw8SfPD3kabkFRrnDlOMDzlzb8+fz/CFrSDBYe/8bnE82lAOprdNvCXPygKK048MWXr9nyCs13Z1neRaqeNoFtoy4jSOYWnDs7KCxyKlG7r66UyRIA4bexfQxDGi/VD2isXfrLEJz5g5qujhK3Z9YZqgLqwLjBsxZp0EYCLE7ghItF6tb68BEaLhjiwcNf2a3pddAB1pbTPU6As4KogiIBSisOXCfnCUiMVvMjAYoKyh7BX6+8A5QIgPj6WoWhF6EP2gtTd5AgIwxCmsC4/ERhgNzbnjw/BLrBajEQd9gEOFWLYvUwxgC6xe1lAkD/fmHDyoot/o7IHzJFVHHkWCZwmBdd03NnB9m92Q3QB8z/b6oVKXHh+9kDvDl9K4vFpSq7PfO2LRTsF+r9/MJe5ehgHX/89L8Mw9C6oGoZDS+hQQK3ZNkhqQZUpQAaa6irZRbfiwxXp9SDT0i4Ly6+Bl2Ac5jrs5Ea24ti6RhGA1VjAXPFTYZh2yAEaET9Lr4Wfj8oAEmDaksfbP+8BgkYwQDRyLHMjioeGX/98lSlofN7wa3pdWUi6GQkNnuB4g27LgM9g3BSQQ24KuBNqPe/Nb0uMoIq0oBKCFsG9R4FQQIrmOSMFGitq0gBTNxE8Ry3ptex3kD6+5+QqzX0h5sjqqsDgmHi0+MD0t9FsR1V4qZc4fDNtYo0wSYK8s+dNOpDRQ2/UGLSwMocWT   *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    background:var(--black);
    color:rgba(255,255,255,.92);
    overflow:hidden;
  }

  .app{
    height:100vh;
    min-height:0;
    display:grid;
    grid-template-columns:minmax(0,1fr);
    grid-template-rows:minmax(0,1fr);
    gap:16px;
    padding:16px;
    position:relative;
    overflow:hidden;
    background:linear-gradient(135deg,#1a1e6e,#343ced,#5a3ed8,#7ac455 90%,#d8fd49);
  }

  .app:before{
    content:"";
    position:absolute;
    inset:0;
    background:
      radial-gradient(circle at 10% 10%,rgba(255,255,255,.04) 0%,transparent 50%),
      radial-gradient(circle at 90% 90%,rgba(216,253,73,.06) 0%,transparent 28%);
    pointer-events:none;
    z-index:0;
  }

  .app:after{
    content:"";
    position:absolute;
    inset:0;
    background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);
    background-size:32px 32px;
    pointer-events:none;
    z-index:0;
  }

  .main{
    position:relative;
    z-index:1;
    min-width:0;
    min-height:0;
    display:grid;
    grid-template-rows:auto minmax(0,1fr);
    gap:16px;
  }

  .card{
    background:rgba(255,255,255,.06);
    -webkit-backdrop-filter:blur(20px);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.1);
    border-radius:var(--radius);
  }

  .toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:14px 18px;
  }

  .brandWrap{
    display:flex;
    align-items:center;
    gap:14px;
    min-width:0;
  }

  .brandMark{
    display:grid;
    place-items:center;
    width:44px;
    height:44px;
    border-radius:14px;
    background-color:var(--blue);
    -webkit-mask-image:var(--brandMarkImg);
    -webkit-mask-size:contain;
    -webkit-mask-repeat:no-repeat;
    -webkit-mask-position:center;
    mask-image:var(--brandMarkImg);
    mask-size:contain;
    mask-repeat:no-repeat;
    mask-position:center;
    flex:0 0 auto;
  }

  .brandText{min-width:0}
  .brandEyebrow{
    margin:0 0 2px;
    font-size:12px;
    font-weight:600;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--green);
  }
  .brandTitle{
    margin:0;
    font-size:20px;
    line-height:1.05;
    font-weight:800;
    color:rgba(255,255,255,.96);
  }
  .brandSub{
    margin:4px 0 0;
    font-size:13px;
    line-height:1.35;
    color:rgba(255,255,255,.65);
  }

  .controls{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:nowrap;
    justify-content:flex-end;
    flex-shrink:0;
  }

  .segmented{
    display:inline-flex;
    padding:4px;
    background:rgba(0,0,0,.35);
    border:1px solid rgba(255,255,255,.12);
    border-radius:999px;
    gap:4px;
  }

  .segmented button,
  .ghostBtn{
    appearance:none;
    border:none;
    background:transparent;
    color:rgba(255,255,255,.88);
    font:inherit;
    cursor:pointer;
  }

  .segmented button{
    padding:10px 14px;
    border-radius:999px;
    font-weight:700;
  }

  .segmented button:not(.active):hover{background:rgba(255,255,255,.08)}

  .segmented button.active{
    background:var(--blue);
    color:var(--white);
  }

  .ghostBtn{
    padding:10px 12px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:12px;
    background:rgba(255,255,255,.08);
    font-weight:700;
  }

  .ghostBtn:hover{
    background:rgba(255,255,255,.14);
    border-color:rgba(255,255,255,.22);
  }

  .stageWrap{
    position:relative;
    overflow:hidden;
    min-height:0;
    cursor:grab;
    user-select:none;
    display:flex;
    flex-direction:column;
  }

  .stageWrap.dragging{ cursor:grabbing; }

  .stageRow{
    flex:1 1 auto;
    min-height:0;
    display:flex;
    flex-direction:row;
    gap:0;
    border-top:1px solid rgba(255,255,255,.1);
  }

  .stagePanel{
    flex:1 1 50%;
    min-width:0;
    min-height:0;
    display:flex;
    flex-direction:column;
    position:relative;
  }

  .stagePanel + .stagePanel{
    border-left:1px solid rgba(255,255,255,.1);
  }

  .stagePanelLabel{
    flex:0 0 auto;
    padding:8px 12px;
    font-size:11px;
    font-weight:700;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--green);
    background:rgba(0,0,0,.28);
    border-bottom:1px solid rgba(255,255,255,.1);
  }

  .stageSvg{
    display:block;
    flex:1 1 auto;
    min-height:0;
    width:100%;
    background:rgba(0,0,0,.2);
    touch-action:none;
  }

  .outputDocBody{
    font-size:11px;
    font-weight:500;
    fill:rgba(255,255,255,.92);
    text-anchor:start;
    pointer-events:none;
  }

  .outputDocCaret{
    fill:rgba(255,255,255,.75);
    font-weight:900;
  }

  .nodeDetailPopover{
    position:absolute;
    top:16px;
    right:16px;
    z-index:30;
    width:min(380px,calc(100% - 32px));
    max-height:calc(100% - 32px);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    box-shadow:0 16px 48px rgba(0,0,0,.35),0 0 0 1px rgba(216,253,73,.15);
    pointer-events:auto;
  }

  .nodeDetailPopover.isHidden{
    display:none;
  }

  .nodeDetailHead{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    padding:16px 16px 0;
  }

  .nodeDetailHead .panelEyebrow{margin:0}

  .nodeDetailClose{
    appearance:none;
    border:1px solid rgba(255,255,255,.12);
    border-radius:10px;
    background:rgba(255,255,255,.08);
    color:rgba(255,255,255,.92);
    width:36px;
    height:36px;
    font-size:22px;
    line-height:1;
    font-weight:800;
    cursor:pointer;
    flex-shrink:0;
    display:grid;
    place-items:center;
    padding:0;
  }

  .nodeDetailClose:hover{
    background:rgba(255,255,255,.14);
    border-color:rgba(255,255,255,.22);
  }

  .nodeDetailBody{
    flex:1 1 auto;
    overflow:auto;
    padding:12px 18px 18px;
    min-height:0;
  }

  .panelEyebrow{
    margin:0 0 8px;
    font-size:12px;
    font-weight:800;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--green);
  }

  .panelTitle{
    margin:0;
    font-size:24px;
    line-height:1.05;
    font-weight:900;
    color:rgba(255,255,255,.94);
  }

  .section{margin-top:18px}
  .section h3{
    margin:0 0 8px;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.08em;
    font-weight:900;
    color:var(--green);
  }

  .section p,.section li{
    font-size:14px;
    line-height:1.45;
    margin:0;
    color:rgba(255,255,255,.88);
  }

  .section ul{
    margin:0;
    padding-left:18px;
  }

  .layerBand{
    fill:none;
    stroke:rgba(255,255,255,.22);
    stroke-width:4;
    opacity:.65;
  }

  .memoryRing{
    fill:none;
    stroke:var(--blue-light);
    stroke-width:2;
    stroke-dasharray:8 10;
    opacity:.55;
  }

  .bandLabel{
    font-size:20px;
    font-weight:900;
    fill:var(--green);
    letter-spacing:.06em;
    text-transform:uppercase;
  }

  .bandSub{
    font-size:16px;
    font-weight:500;
    fill:rgba(255,255,255,.72);
  }

  .ringLabel{
    font-size:14px;
    font-weight:900;
    fill:var(--green);
    letter-spacing:.08em;
    text-transform:uppercase;
  }

  .sectionLabel{
    font-size:16px;
    font-weight:900;
    fill:var(--green);
    letter-spacing:.08em;
    text-transform:uppercase;
  }

  .edge{
    fill:none;
    stroke:#c8c8c8;
    opacity:.55;
    stroke-width:4;
  }

  .edge.memory{opacity:.45}
  .edge.bridge{opacity:.32;stroke-width:1.2}
  .edge.tool{opacity:.32}
  .edge.llm{opacity:.4;stroke-width:1.4}
  .edge.competitor{opacity:.38;stroke-width:1.5;stroke-dasharray:8 8}

  .node{cursor:pointer}
  .node .shape{
    stroke:rgba(255,255,255,.35);
    stroke-width:1.6;
    fill:var(--white);
  }

  .node.user .shape{fill:var(--blue)}
  .node.memory .shape{fill:var(--green)}
  .node.tool .shape,
  .node.team .shape{fill:var(--oatmeal)}
  .node.llm .shape,
  .node.datasource .shape{fill:var(--white)}
  .node.outputDoc .shape{
    fill:rgba(0,0,0,.15);
    stroke:rgba(255,255,255,.22);
    stroke-dasharray:6 4;
  }

  .node.selected .shape{
    stroke:var(--green);
    stroke-width:3;
  }

  #gleanSvg .node.travelerVisitHighlight .shape{
    fill:var(--green);
  }

  #gleanSvg .node.outputDoc.travelerVisitHighlight .shape{
    fill:rgba(0,0,0,.22);
  }

  .node.outputDoc .nodeLabel{
    fill:rgba(255,255,255,.95);
  }

  .node.outputDoc .iconStroke{
    stroke:rgba(255,255,255,.92);
  }

  .node.outputDoc .iconFill{
    fill:rgba(255,255,255,.92);
  }

  .nodeLabel{
    font-size:16px;
    font-weight:800;
    text-anchor:middle;
    fill:var(--black);
    pointer-events:none;
  }

  .nodeLabelSub{
    font-size:14px;
    font-weight:500;
    text-anchor:middle;
    fill:var(--black);
    opacity:.72;
    pointer-events:none;
  }

  .node.user .nodeLabel,
  .node.user .nodeLabelSub{
    fill:rgba(255,255,255,.95);
    opacity:1;
  }

  .node.user .nodeLabelSub{opacity:.85}

  .iconStroke{
    stroke:var(--blue);
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
    fill:none;
    pointer-events:none;
  }

  .iconFill{
    fill:var(--blue);
    pointer-events:none;
  }

  .node.user .iconStroke{stroke:var(--white)}
  .node.user .iconFill{fill:var(--white)}

  .nodeConnectorIcon{
    pointer-events:none;
  }

  .traveler{
    fill:var(--green);
    stroke:rgba(0,0,0,.35);
    stroke-width:1;
  }

  .indexPill{
    fill:#22c55e;
    stroke:rgba(255,255,255,.35);
    stroke-width:0.6;
  }

  .llmTraveler{
    fill:var(--blue);
    stroke:rgba(255,255,255,.45);
    stroke-width:1;
  }

  .sunRay{
    stroke:var(--blue-light);
    opacity:.22;
    stroke-width:1.1;
    fill:none;
  }

  .graphDetailSeg{margin-left:8px}
  .graphDetailSeg.isHidden{display:none}

  @media (max-width:720px){
    .nodeDetailPopover{
      width:min(100%,calc(100% - 24px));
      right:12px;
      top:12px;
      max-height:calc(100% - 24px);
    }
  }
</style>
</head>
<body>
<div class="app">
  <div class="main">
    <div class="toolbar card">
      <div class="brandWrap">
        <div class="brandMark" role="img" aria-label="Glean"></div>
        <div class="brandText">
          <p class="brandEyebrow">Glean™ Context Engine</p>
          <h1 class="brandTitle" id="pageTitle">Enterprise Knowledge Graph</h1>

      let t = Math.imul(a ^ a >>> 15, a | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function shuffleWithRand(arr, rand){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(rand() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function personalKnowledgeNodeIds(){
    return [
      ...data.people.map(n => n.id),
      ...data.teams.map(n => n.id),
      ...data.projects.map(n => n.id),
      ...data.meetings.map(n => n.id),
      ...data.documents.map(n => n.id),
      ...data.memories.map(n => n.id)
    ].filter(id => nodeById[id]);
  }

  function enterpriseKnowledgeNodeIds(){
    return [
      ...data.orgNodes,
      ...data.departments,
      ...data.enterpriseDocuments,
      ...data.partners,
      ...data.opportunities,
      ...data.accounts,
      ...data.dataSources
    ].map(n => n.id).filter(id => nodeById[id]);
  }

  function gleanKnowledgePoolForTravel(){
    if(state.graphDetail === 'collapsed'){
      const pers = ['hub-pers-people','hub-pers-teams','hub-pers-projects','hub-pers-meetings','hub-pers-documents'].map(id => nodeById[id] && id).filter(Boolean);
      const ent = COLLAPSE_HUB_ENTERPRISE_NO_DS.map(id => nodeById[id] && id).filter(Boolean);
      return pers.concat(ent);
    }
    return personalKnowledgeNodeIds().concat(
      enterpriseKnowledgeNodeIds().filter(id => !data.dataSources.some(ds => ds.id === id))
    );
  }

  function gleanPathDurationFromPlan(plan){
    if(!plan || !plan.travelers || !plan.travelers.length){
      return TRAVELER_SEGMENT_SEC + TRAVELER_SEGMENT_SEC + OUTPUT_DOC_TYPING_SEC;
    }
    const maxE = Math.max(...plan.travelers.map(tr => Math.max(0, tr.pathToLlm.length - 1)), 1);
    return maxE * TRAVELER_SEGMENT_SEC + TRAVELER_SEGMENT_SEC + OUTPUT_DOC_TYPING_SEC;
  }

  /**
   * Randomized multi-traveler plan for Glean: each dot starts at the user profile, takes 1–3 bounce hops
   * among personal/enterprise nodes (no immediate revisit), converges on one chosen LLM; LLM→doc after
   * the longest path finishes. Deterministic in cycleIdx so loop timing stays consistent.
   */
  function generateGleanTravelPlan(cycleIdx){
    const rand = mulberry32((cycleIdx + 1) * 0x9E3779B1);
    const pool = shuffleWithRand(gleanKnowledgePoolForTravel(), rand);
    const llmIds = data.llms.map(l => l.id).filter(id => nodeById[id]);
    const targetLlm = llmIds.length ? llmIds[Math.floor(rand() * llmIds.length)] : 'llm-openai';
    const uid = data.user.id;

    if(!pool.length){
      return {
        targetLlm,
        travelers: [{ pathToLlm: [uid, targetLlm] }]
      };
    }

    const numTravelers = 5;
    const travelers = [];
    for(let i = 0; i < numTravelers; i++){
      const bounceSteps = 1 + Math.floor(rand() * 3);
      const path = [uid];
      let prev = uid;
      for(let b = 0; b < bounceSteps; b++){
        const choices = pool.filter(id => id !== prev);
        if(!choices.length) break;
        const next = choices[Math.floor(rand() * choices.length)];
        path.push(next);
        prev = next;
      }
      path.push(targetLlm);
      travelers.push({ pathToLlm: path });
    }
    return { targetLlm, travelers };
  }

  function gleanLocalTimeInCycle(elapsed){
    let t = 0;
    for(let idx = 0; ; idx++){
      const plan = generateGleanTravelPlan(idx);
      const dur = gleanPathDurationFromPlan(plan) + CYCLE_GAP_SEC;
      if(elapsed < t + dur){
        return { tRaw: elapsed - t, plan, pathDur: gleanPathDurationFromPlan(plan) };
      }
      t += dur;
    }
  }

  function computeGleanVisitedNodeIds(tRaw, plan, pathDur){
    const docId = GLEAN_OUTPUT_DOC_ID;
    const visited = new Set();
    if(tRaw >= pathDur || !plan || !plan.travelers || !plan.travelers.length){
      return visited;
    }
    const maxE = Math.max(...plan.travelers.map(tr => Math.max(1, tr.pathToLlm.length - 1)), 1);
    const toLlmDur = maxE * TRAVELER_SEGMENT_SEC;

    if(tRaw < toLlmDur){
      const segIdx = Math.floor(tRaw / TRAVELER_SEGMENT_SEC);
      plan.travelers.forEach(tr => {
        const path = tr.pathToLlm;
        const E = path.length - 1;
        for(let i = 0; i <= Math.min(segIdx, E); i++){
          visited.add(path[i]);
        }
      });
      return visited;
    }

    plan.travelers.forEach(tr => {
      tr.pathToLlm.forEach(id => visited.add(id));
    });

    const tDoc = tRaw - toLlmDur;
    if(tDoc < TRAVELER_SEGMENT_SEC){
      if(tDoc > 0) visited.add(docId);
      return visited;
    }
    visited.add(docId);
    return visited;
  }

  function compCycleTiming(){
    const travelDur = (data.dataSources || []).length < 1
      ? 2 * TRAVELER_SEGMENT_SEC
      : 8 * TRAVELER_SEGMENT_SEC;
    const pathDur = travelDur + OUTPUT_DOC_TYPING_SEC;
    return { pathDur, cycleLen: pathDur + CYCLE_GAP_SEC };
  }

  function refreshLifecycleRandomPicks(now){
    const elapsed = (now - state.animStartMs) / 1000;
    const c = compCycleTiming();
    const cIdx = Math.floor(elapsed / c.cycleLen);
    if(state.compLifecycleCycle !== cIdx){
      state.compLifecycleCycle = cIdx;
      state.compLifecycleTrios = competitorRoundTrios();
    }
  }

  /** Glean view: wheel capped at 200%. */

  const COMPETITOR_CAMERA_START_SCALE = 1;

  function randomPathInt(n){
    return Math.floor(Math.random() * n);
  }

  function shufflePathIds(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function posFromMap(id, posMap){
    const p = posMap[id];
    if(p) return p;
    const n = nodeById[id];
    return n ? { x: n.x, y: n.y } : null;
  }

  function distSeg(aId, bId, posMap){
    const a = posFromMap(aId, posMap);
    const b = posFromMap(bId, posMap);
    if(!a || !b) return 1;
    return Math.max(1e-6, Math.hypot(b.x - a.x, b.y - a.y));
  }

  /** LLM→answer edges attach here (not node center): Glean top-left, competitor top-right. */
  function outputDocEdgeAnchor(node, which){
    const sz = nodeSize(node);
    if(node.kind !== 'outputDoc') return { x: node.x, y: node.y };
    const top = node.y - sz.h / 2;
    if(which === 'glean'){
      return { x: node.x - sz.w / 2, y: top };
    }
    return { x: node.x + sz.w / 2, y: top };
  }

  function gleanLifecycleVisual(now, startMs, posMap){
    const docId = GLEAN_OUTPUT_DOC_ID;
    const elapsed = (now - startMs) / 1000;
    const { tRaw, plan, pathDur } = gleanLocalTimeInCycle(elapsed);
    const visitedIds = computeGleanVisitedNodeIds(tRaw, plan, pathDur);
    const circles = [];

    const interp = (aId, bId, frac, cls) => {
      const A = posFromMap(aId, posMap);
      const B = posFromMap(bId, posMap);
      if(!A || !B) return;
      circles.push({
        x: A.x + (B.x - A.x) * frac,
        y: A.y + (B.y - A.y) * frac,
        cls: cls || 'traveler'
      });
    };

    if(tRaw >= pathDur){
      return { circles, docCharCount: OUTPUT_DOC_PLACEHOLDER.length, visitedIds: new Set() };
    }

    if(!plan || !plan.travelers || !plan.travelers.length){
      return { circles, docCharCount: 0, visitedIds };
    }

    const maxE = Math.max(...plan.travelers.map(tr => Math.max(1, tr.pathToLlm.length - 1)), 1);
    const toLlmDur = maxE * TRAVELER_SEGMENT_SEC;

    if(tRaw < toLlmDur){
      plan.travelers.forEach(tr => {
        const path = tr.pathToLlm;
        const E = path.length - 1;
        if(E < 1) return;
        const segIdx = Math.floor(tRaw / TRAVELER_SEGMENT_SEC);
        const frac = Math.min(1, (tRaw % TRAVELER_SEGMENT_SEC) / TRAVELER_SEGMENT_SEC);
        const onLastHop = segIdx === E - 1;
        if(segIdx < E && !(onLastHop && frac >= 1)){
          interp(path[segIdx], path[segIdx + 1], frac, 'traveler');
        }
      });
      return { circles, docCharCount: 0, visitedIds };
    }

    const tDoc = tRaw - toLlmDur;
    if(tDoc < TRAVELER_SEGMENT_SEC){
      const frac = Math.min(1, tDoc / TRAVELER_SEGMENT_SEC);
      if(frac < 1){
        const A = posFromMap(plan.targetLlm, posMap);
        const docNode = mergedNodeForDraw(nodeById[docId], posMap);
        const B = outputDocEdgeAnchor(docNode, 'glean');
        if(A){
          circles.push({
            x: A.x + (B.x - A.x) * frac,
            y: A.y + (B.y - A.y) * frac,
            cls: 'llmTraveler'
          });
        }
      }
      return { circles, docCharCount: 0, visitedIds };
    }

    const tType = tDoc - TRAVELER_SEGMENT_SEC;
    const docCharCount = Math.min(OUTPUT_DOC_PLACEHOLDER.length, Math.floor(tType * TYPING_CHARS_PER_SEC));
    return { circles, docCharCount, visitedIds };
  }

  function competitorRoundTrios(){
    const ids = (data.dataSources || []).map(d => d.id);
    const out = [];
    for(let r = 0; r < 3; r++){
      const t = shufflePathIds(ids.slice());
      out.push([t[0], t[1 % Math.max(1, t.length)], t[2 % Math.max(1, t.length)]].filter(Boolean));
    }
    return out;
  }

  function competitorLifecycleVisual(now, startMs, posMap, trios){
    const uid = data.user.id;
    const llm = 'comp-llm';
    const docId = COMP_OUTPUT_DOC_ID;
    const { pathDur, cycleLen } = compCycleTiming();
    const elapsed = (now - startMs) / 1000;
    const tRaw = elapsed - Math.floor(elapsed / cycleLen) * cycleLen;
    const circles = [];
    const dsIds = (data.dataSources || []).map(d => d.id);

    const interp = (aId, bId, frac, cls) => {
      const A = posFromMap(aId, posMap);
      const B = posFromMap(bId, posMap);
      if(!A || !B) return;
      circles.push({
        x: A.x + (B.x - A.x) * frac,
        y: A.y + (B.y - A.y) * frac,
        cls: cls || 'traveler'
      });
    };

    const interpLlmToAnswer = frac => {
      const A = posFromMap(llm, posMap);
      const docNode = mergedNodeForDraw(nodeById[docId], posMap);
      const B = outputDocEdgeAnchor(docNode, 'comp');
      if(!A) return;
      circles.push({
        x: A.x + (B.x - A.x) * frac,
        y: A.y + (B.y - A.y) * frac,
        cls: 'llmTraveler'
      });
    };

    if(tRaw >= pathDur){
      return { circles, docCharCount: OUTPUT_DOC_PLACEHOLDER.length };
    }

    let t = tRaw;

    if(!dsIds.length){
      if(t < TRAVELER_SEGMENT_SEC){
        interp(uid, llm, Math.min(1, t / TRAVELER_SEGMENT_SEC), 'traveler');
        return { circles, docCharCount: 0 };
      }
      t -= TRAVELER_SEGMENT_SEC;
      if(t < TRAVELER_SEGMENT_SEC){
        const fd = Math.min(1, t / TRAVELER_SEGMENT_SEC);
        if(fd < 1) interpLlmToAnswer(fd);
        return { circles, docCharCount: 0 };
      }
      t -= TRAVELER_SEGMENT_SEC;
      return { circles, docCharCount: Math.min(OUTPUT_DOC_PLACEHOLDER.length, Math.floor(t * TYPING_CHARS_PER_SEC)) };
    }

    const triosStable = trios && trios.length ? trios : competitorRoundTrios();

    if(t < TRAVELER_SEGMENT_SEC){
      interp(uid, llm, Math.min(1, t / TRAVELER_SEGMENT_SEC), 'traveler');
      return { circles, docCharCount: 0 };
    }
    t -= TRAVELER_SEGMENT_SEC;

    for(let r = 0; r < 3; r++){
      const trio = triosStable[r] || [];
      if(t < TRAVELER_SEGMENT_SEC){
        const frac = Math.min(1, t / TRAVELER_SEGMENT_SEC);
        for(let i = 0; i < 3; i++){
          if(trio[i]) interp(llm, trio[i], frac, 'llmTraveler');
        }
        return { circles, docCharCount: 0 };
      }
      t -= TRAVELER_SEGMENT_SEC;

      if(t < TRAVELER_SEGMENT_SEC){
        const frac = Math.min(1, t / TRAVELER_SEGMENT_SEC);
        for(let i = 0; i < 3; i++){
          if(trio[i]) interp(trio[i], llm, frac, 'traveler');
        }
        return { circles, docCharCount: 0 };
      }
      t -= TRAVELER_SEGMENT_SEC;
    }

    if(t < TRAVELER_SEGMENT_SEC){
      const fd = Math.min(1, t / TRAVELER_SEGMENT_SEC);
      if(fd < 1) interpLlmToAnswer(fd);
      return { circles, docCharCount: 0 };
    }
    t -= TRAVELER_SEGMENT_SEC;

    const docCharCount = Math.min(OUTPUT_DOC_PLACEHOLDER.length, Math.floor(t * TYPING_CHARS_PER_SEC));
    return { circles, docCharCount };
  }

  function collapsedGleanEdges(){
    const uid = data.user.id;
    const edges = [];
    const t = 'bridge';
    const pers = ['hub-pers-people','hub-pers-teams','hub-pers-projects','hub-pers-meetings','hub-pers-documents'];
    const ent = COLLAPSE_HUB_ENTERPRISE_NO_DS.slice();
    const link = (a, b, ty) => edges.push({ a, b, type: ty || t });
    pers.forEach(id => { if(nodeById[id]) link(uid, id); });
    ent.forEach(id => { if(nodeById[id]) link(uid, id); });
    const persIds = pers.map(id => nodeById[id] && id).filter(Boolean);
    const entIds = ent.map(id => nodeById[id] && id).filter(Boolean);
    for(let i = 0; i < persIds.length; i++){
      for(let j = i + 1; j < persIds.length; j++){
        link(persIds[i], persIds[j]);
      }
    }
    for(let i = 0; i < entIds.length; i++){
      for(let j = i + 1; j < entIds.length; j++){
        link(entIds[i], entIds[j]);
      }
    }
    persIds.forEach(p => {
      entIds.forEach(e => link(p, e));
    });

  const WRITING_CONTEXT_ID = 'action-writing-context';

  const DS_TOOL_GAP = 15;
  const ENT_LAYER_CONTENT_PAD = 15;
  const TOOL_NODE_R = 26;
  const TOOL_LABEL_BELOW = 42;
  const DS_TOOL_RAD_X = 112;
  const DS_TOOL_RAD_Y = 92;

  function toolsForDatasource(ds){
    return data.actions.filter(n => n.parent === ds.id);
  }

  function layoutDatasourceToolsRadial(ds){
    const tools = toolsForDatasource(ds).filter(t => t.id !== WRITING_CONTEXT_ID);
    const angles = [-90, -28, 28, 90, 152, 208, 260, 315];
    tools.forEach((tool, i) => {
      const angle = (angles[i % angles.length] * Math.PI) / 180;
      tool.x = ds.x + Math.cos(angle) * DS_TOOL_RAD_X;
      tool.y = ds.y + Math.sin(angle) * DS_TOOL_RAD_Y;
    });
  }

  function clusterBBoxForDs(ds){
    const tr = TOOL_NODE_R;
    const dr = 34;
    let minX = ds.x - dr;
    let maxX = ds.x + dr;
    let minY = ds.y - dr;
    let maxY = ds.y + dr;
    toolsForDatasource(ds).filter(t => t.id !== WRITING_CONTEXT_ID).forEach(t => {
      minX = Math.min(minX, t.x - tr);
      maxX = Math.max(maxX, t.x + tr);
      minY = Math.min(minY, t.y - tr);
      maxY = Math.max(maxY, t.y + tr + TOOL_LABEL_BELOW);
    });
    return { minX, maxX, minY, maxY };
  }

  function bboxOverlap2D(a, b, gap){
    return !(a.maxX + gap <= b.minX || b.maxX + gap <= a.minX || a.maxY + gap <= b.minY || b.maxY + gap <= a.minY);
  }

  function datasourcePairwiseOverlap(dss){
    for(let i = 0; i < dss.length; i++){
      for(let j = i + 1; j < dss.length; j++){
        if(bboxOverlap2D(clusterBBoxForDs(dss[i]), clusterBBoxForDs(dss[j]), DS_TOOL_GAP)) return true;
      }
    }
    return false;
  }

  function separateDatasourceClustersVertically(dss){
    const rows = [];
    dss.forEach(ds => {
      let row = rows.find(r => r.length && Math.abs(r[0].y - ds.y) < 8);
      if(!row){
        row = [];
        rows.push(row);
      }
      row.push(ds);
    });
    rows.sort((a, b) => a[0].y - b[0].y);
    for(let ri = 1; ri < rows.length; ri++){
      const prevRow = rows[ri - 1];
      const curRow = rows[ri];
      let maxBottom = -Infinity;
      prevRow.forEach(ds => {
        const bb = clusterBBoxForDs(ds);
        maxBottom = Math.max(maxBottom, bb.maxY);
      });
      let minTop = Infinity;
      curRow.forEach(ds => {
        const bb = clusterBBoxForDs(ds);
        minTop = Math.min(minTop, bb.minY);
      });
      const slack = minTop - maxBottom;
      if(slack < DS_TOOL_GAP){
        const dy = DS_TOOL_GAP - slack;
        curRow.forEach(ds => shiftDsCluster(ds, 0, dy));
      }
    }
  }

  function resolveDatasourceClustersNoOverlap(dss, gLeft, gRight){
    let iter = 0;
    while(datasourcePairwiseOverlap(dss) && iter < 18){
      separateDatasourceClustersHoriz(dss);
      separateDatasourceClustersVertically(dss);
      if(gLeft != null && gRight != null) clampDatasourceClustersToBand(gLeft, gRight);
      iter++;
    }
  }

  function shiftDsCluster(ds, dx, dy){
    ds.x += dx;
    ds.y += dy;
    toolsForDatasource(ds).forEach(t => {
      if(t.id !== WRITING_CONTEXT_ID){
        t.x += dx;
        t.y += dy;
      }
    });
  }

  function pickColsForDatasourceGrid(n, availW){
    if(n <= 0) return 1;
    let c = colsForCount(n);
    const minCell = 2 * (DS_TOOL_RAD_X + TOOL_NODE_R) + DS_TOOL_GAP;
    while(c > 1 && availW / c < minCell) c--;
    return Math.max(1, c);
  }

  function separateDatasourceClustersHoriz(dss){
    const rows = [];
    dss.forEach(ds => {
      let row = rows.find(r => r.length && Math.abs(r[0].y - ds.y) < 6);
      if(!row){
        row = [];
        rows.push(row);
      }
      row.push(ds);
    });
    rows.forEach(row => {
      row.sort((a, b) => a.x - b.x);
      for(let i = 1; i < row.length; i++){
        const prev = row[i - 1];
        const cur = row[i];
        const bbp = clusterBBoxForDs(prev);
        const bbc = clusterBBoxForDs(cur);
        const gap = bbc.minX - bbp.maxX;
        if(gap < DS_TOOL_GAP) shiftDsCluster(cur, DS_TOOL_GAP - gap, 0);
      }
    });
  }

  function clampDatasourceClustersToBand(gLeft, gRight){
    data.dataSources.forEach(ds => {
      const bb = clusterBBoxForDs(ds);
      if(bb.minX < gLeft + ENT_LAYER_CONTENT_PAD){
        shiftDsCluster(ds, gLeft + ENT_LAYER_CONTENT_PAD - bb.minX, 0);
      }
    });
    data.dataSources.forEach(ds => {
      const bb = clusterBBoxForDs(ds);
      if(bb.maxX > gRight - ENT_LAYER_CONTENT_PAD){
        shiftDsCluster(ds, gRight - ENT_LAYER_CONTENT_PAD - bb.maxX, 0);
      }
    });
  }

  function toolSunRayEdgesGlean(){
    return [];
  }

  function toolSunRayEdgesComp(){
    return [];
  }

  function dedupeUndirectedEdges(edges){
    const seen = new Set();
    const out = [];
    edges.forEach(e => {
      const k = e.a < e.b ? `${e.a}|${e.b}|${e.type || ''}` : `${e.b}|${e.a}|${e.type || ''}`;
      if(seen.has(k)) return;
      seen.add(k);
      out.push(e);
    });
    return out;
  }

  function isUserLlmEdge(edge){
    const uid = data.user.id;
    const llmSet = new Set(data.llms.map(l => l.id));
    return (edge.a === uid && llmSet.has(edge.b)) || (edge.b === uid && llmSet.has(edge.a));
  }

  function edgeTouchesDatasource(edge){
    const na = nodeById[edge.a];
    const nb = nodeById[edge.b];
    return (na && na.kind === 'datasource') || (nb && nb.kind === 'datasource');
  }

  function expandedGleanDenseEdges(){
    const edges = [];
    const pers = personalKnowledgeNodeIds();
    const dsIdSet = new Set((data.dataSources || []).map(ds => ds.id));
    const ent = enterpriseKnowledgeNodeIds().filter(id => !dsIdSet.has(id));
    const llmIds = data.llms.map(l => l.id).filter(id => nodeById[id]);
    const link = (a, b, ty) => {
      if(nodeById[a] && nodeById[b]) edges.push({ a, b, type: ty || 'bridge' });
    };
    for(let i = 0; i < pers.length; i++){
      for(let j = i + 1; j < pers.length; j++){
        link(pers[i], pers[j]);
      }
    }
    for(let i = 0; i < ent.length; i++){
      for(let j = i + 1; j < ent.length; j++){
        link(ent[i], ent[j]);
      }
    }
    pers.forEach(p => {
      ent.forEach(e => link(p, e));
    });
    const mesh = pers.concat(ent);
    llmIds.forEach(lid => {
      mesh.forEach(nid => link(nid, lid, 'llm'));
      if(nodeById[GLEAN_OUTPUT_DOC_ID]) link(lid, GLEAN_OUTPUT_DOC_ID, 'llm');
    });
    return edges;
  }

  function visibleEdgesGlean(){
    if(state.graphDetail === 'collapsed') return collapsedGleanEdges();
    const base = (data.edges || []).map(edge => ({
      a: edge.a || edge.source,
      b: edge.b || edge.target,

    })).filter(edge => nodeById[edge.a] && nodeById[edge.b]).filter(e => !isUserLlmEdge(e)).filter(e => !edgeTouchesDatasource(e));

  function visibleEdgesCompetitor(){

  function gridAssign(list,x0,x1,y0,stepY,cols){
    const c = Math.max(1, cols);
    const stepX = c > 1 ? (x1 - x0) / (c - 1) : 0;
    list.forEach((n,i)=>{
      const col = i % c;
      const row = Math.floor(i / c);
      n.x = x0 + stepX * col;
      n.y = y0 + stepY * row;
    });
  }

  function gridAssignPacked(list,x0,x1,y0,stepY,cols,tight){
    const t = tight != null ? tight : 0.86;
    const mid = (x0 + x1) / 2;
    const span = (x1 - x0) * t;
    gridAssign(list, mid - span / 2, mid + span / 2, y0, stepY, cols);
  }

  function llmAssignFixedGap(list, x0, x1, y, edgePad){
    const n = list.length;
    if(!n) return;
    const pad = edgePad != null ? edgePad : 36;
    const lo = x0 + pad;
    const hi = x1 - pad;
    const mid = (lo + hi) / 2;
    const w = 2 * LLM_NODE_R;
    const g = LLM_NODE_GAP_X;
    if(n === 1){
      list[0].x = mid;
      list[0].y = y;
      return;
    }
    const clusterW = n * w + (n - 1) * g;
    const left = mid - clusterW / 2;
    list.forEach((node, i) => {
      node.x = left + w / 2 + i * (w + g);
      node.y = y;
    });
  }

  function colsForCount(n){
    if(n <= 0) return 1;
    return Math.max(1, Math.min(18, Math.ceil(Math.sqrt(n * 5.6))));
  }

  function gridBlockHeight(n, cols, rowStep){
    if(n <= 0) return 0;
    return Math.ceil(n / Math.max(1, cols)) * rowStep;
  }

  /**
   * Place datasource nodes (r=34) evenly on X within [gLeft,gRight]: uniform gaps
   * between circle edges (and from band edges) all ≥ minGapPx; wrap to more rows when needed.
   * Does not run resolveDatasourceClustersNoOverlap — that was shifting clusters and breaking spacing.
   */
  function layoutDatasourceNodesFixedGap(dss, gLeft, gRight, yFirstCenter){
    const DS_R = 34;
    const minGapPx = 25;
    const GAP_V = 20;
    const d = 2 * DS_R;
    const span = gRight - gLeft;
    if(!dss.length) return;
    let maxK = 1;
    for(let k = Math.min(dss.length, 80); k >= 1; k--){
      const g = (span - k * d) / (k + 1);
      if(g >= minGapPx - 1e-6){
        maxK = k;
        break;
      }
    }
    const rows = [];
    for(let i = 0; i < dss.length; i += maxK){
      rows.push(dss.slice(i, i + maxK));
    }
    const rowPitch = d + GAP_V;
    rows.forEach((row, ri) => {
      const k = row.length;
      let g = (span - k * d) / (k + 1);
      if(k === 1 && g < minGapPx){
        row[0].x = (gLeft + gRight) / 2;
        row[0].y = yFirstCenter + ri * rowPitch;
        return;
      }
      const x0 = gLeft + g + DS_R;
      row.forEach((ds, j) => {
        ds.x = x0 + j * (d + g);
        ds.y = yFirstCenter + ri * rowPitch;
      });
    });
  }

  function layoutGlean(){

    const SEC_LABEL_TOP = 14;

    function pyramidWidth(layerIdx){
      const base = LAYER_MIN_W + (LAYER_MAX_W - LAYER_MIN_W) * (layerIdx / 3);
      return layerIdx >= 2 ? base * 1.4 : base;
    }

    /** Full graph: shift pyramid so memory ring (~200px) has 150px clear of layer grid (label column). */

      : 1180;

    function pyramidBounds(layerIdx, widthScale, centerX){
      const cx = centerX != null ? centerX : pyramidCenterX;
      const scale = widthScale != null ? widthScale : 1;
      const w = pyramidWidth(layerIdx) * scale;
      return { x0: cx - w / 2, x1: cx + w / 2, w };
    }

    function registerLayer(layerIdx, yTop, height, title, subtitle, widthScale, centerX){
      const b = pyramidBounds(layerIdx, widthScale, centerX);

      layoutGeom.bandTexts.push({ x: b.x0 + 34, y: yTop + 42, text: subtitle, cls: 'bandSub' });

  function gleanConnectorIconPayload(){
    const raw = window.GLEAN_CONNECTOR_ICON_DATA;
    if(!raw || typeof raw !== 'object') return { bySlug:{}, byConnectorNameLower:{} };
    return {

  function connectorIconUrlForNode(node){
    if(!node || node.kind !== 'datasource') return null;
    if(node.iconUrl) return node.iconUrl;
    const { bySlug, byConnectorNameLower } = gleanConnectorIconPayload();
    const slugRaw = String(node.connectorSlug || '').toLowerCase().replace(/^\/+|\/+$/g,'');
    if(slugRaw && bySlug[slugRaw]) return bySlug[slugRaw];
    const id = String(node.id || '');
    const idSlug = id.replace(/^ds-/i,'').toLowerCase();
    if(idSlug && bySlug[idSlug]) return bySlug[idSlug];
    const labelKey = String(node.label || '').toLowerCase().replace(/\s+/g,' ').trim();
    if(labelKey && byConnectorNameLower[labelKey]) return byConnectorNameLower[labelKey];
    const guess = labelKey
      .replace(/&/g,'and')
      .replace(/[()'.]/g,' ')
      .replace(/[^a-z0-9]+/g,'-')
      .replace(/^-+|-+$/g,'');
    if(guess && bySlug[guess]) return bySlug[guess];
    return null;
  }

  function llmRasterIconUrlForNode(node){
    if(!node || node.kind !== 'llm') return null;
    if(node.iconUrl) return node.iconUrl;
    const { bySlug, byConnectorNameLower } = gleanConnectorIconPayload();
    const slugOpt = String(node.llmSlug || '').toLowerCase().replace(/^\/+|\/+$/g,'');
    if(slugOpt && bySlug[slugOpt]) return bySlug[slugOpt];
    const id = String(node.id || '');
    const idSlug = id.replace(/^llm-/i,'').toLowerCase();
    if(idSlug && bySlug[idSlug]) return bySlug[idSlug];
    const labelKey = String(node.label || '').toLowerCase().replace(/\s+/g,' ').trim();
    if(labelKey && byConnectorNameLower[labelKey]) return byConnectorNameLower[labelKey];
    const guess = labelKey
      .replace(/&/g,'and')
      .replace(/[()'.]/g,' ')
      .replace(/[^a-z0-9]+/g,'-')
      .replace(/^-+|-+$/g,'');
    if(guess && bySlug[guess]) return bySlug[guess];
    return null;
  }

  function svgConnectorRasterIcon(href, cx, cy, size){
    const half = size / 2;
    const img = document.createElementNS('http://www.w3.org/2000/svg', 'image');

    img.setAttribute('y', String(cy - half));
    img.setAttribute('width', String(size));
    img.setAttribute('height', String(size));
    img.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    img.setAttribute('class', 'nodeConnectorIcon');
    img.setAttributeNS('http://www.w3.org/1999/xlink', 'href', href);
    img.setAttribute('href', href);

  function clampLabel(str){
    const s = String(str || '').replace(/\s+/g,' ').trim();
    return s.length > 50 ? s.slice(0,49) + '…' : s;
  }

  function wrapLabel(str,maxChars=16,maxLines=3){
    const safe = clampLabel(str);
    if(!safe) return [''];
    const words = safe.split(' ');
    const lines = [];
    let current = '';

    words.forEach(word => {
      const candidate = current ? `${current} ${word}` : word;
      if(candidate.length <= maxChars){
        current = candidate;
      } else {
        if(current) lines.push(current);
        current = word.length > maxChars ? word.slice(0, maxChars - 1) + '…' : word;
      }
    });

    if(current) lines.push(current);
    if(lines.length > maxLines){
      const kept = lines.slice(0, maxLines);
      const last = kept[maxLines - 1];
      kept[maxLines - 1] = last.endsWith('…') ? last : `${last.slice(0, Math.max(0, maxChars - 1))}…`;
      return kept;
    }
    return lines;
  }

  function appendTextLines(group, lines, x, y, className, lineHeight){

    lines.forEach((line,idx) => {

      tspan.textContent = line;
      text.appendChild(tspan);
    });
    group.appendChild(text);
    return text;
  }

  function drawNode(node, opts){
    const g = svgEl('g',{class:`node ${node.kind}${state.selected===node.id ? ' selected' : ''}`});
    g.setAttribute('data-node-id', node.id);
    g.addEventListener('click', evt => {
      evt.stopPropagation();
      state.selected = node.id;
      renderStatic({ preserveCamera: true });
    });

    const size = nodeSize(node);
    let iconX = node.x;
    let iconY = node.y;

    if(size.rect){
      g.appendChild(svgEl('rect',{
        x:node.x-size.w/2,
        y:node.y-size.h/2,
        width:size.w,
        height:size.h,
        rx:14,
        class:'shape'
      }));
      if(node.kind === 'outputDoc'){
        const ic = 20;
        const pad = 10;
        iconX = node.x - size.w / 2 + pad + ic / 2;
        iconY = node.y - size.h / 2 + pad + ic / 2;
      } else {
        iconX = node.x - size.w/2 + 18;
        iconY = node.y - Math.min(48, size.h / 2 - 18);
      }
    } else {
      g.appendChild(svgEl('circle',{cx:node.x,cy:node.y,r:size.r,class:'shape'}));
    }

    if(node.kind === 'datasource'){
      const raster = connectorIconUrlForNode(node);
      if(raster) g.appendChild(svgConnectorRasterIcon(raster, iconX, iconY, 28));
      else g.appendChild(iconGroup('database', iconX, iconY, 24));
    } else if(node.kind === 'tool'){
      g.appendChild(iconGroup(node.icon || 'cpu', iconX, iconY, 20));
    } else if(node.kind === 'llm' && opts && opts.isGlean){
      const raster = llmRasterIconUrlForNode(node);
      if(raster) g.appendChild(svgConnectorRasterIcon(raster, iconX, iconY, 28));
      else g.appendChild(iconGroup(node.icon || 'cpu', iconX, iconY, 24));
    } else if(node.kind === 'llm'){
      g.appendChild(iconGroup(node.icon || 'cpu', iconX, iconY, 24));
    } else {
      g.appendChild(iconGroup(node.icon || 'circle', iconX, iconY, size.rect ? 20 : 24));
    }

    if(node.kind === 'outputDoc'){
      const iconPad = 10;
      const iconColumn = 24;
      const titleGap = 10;
      const titleX = node.x - size.w / 2 + iconPad + iconColumn + titleGap;
      const titleY = node.y - size.h / 2 + 24;
      const titleText = appendTextLines(g, wrapLabel(node.label, 14, 2), titleX, titleY, 'nodeLabel', 18);
      titleText.setAttribute('text-anchor', 'start');
      const tg = svgEl('g', { id: `${node.id}-typing` });
      g.appendChild(tg);
    } else if(size.rect){
      const lw = node.kind === 'sectionHub' ? 12 : 17;
      const lines = wrapLabel(node.label, lw, 3);
      appendTextLines(g, lines, node.x + 12, node.y + (lines.length === 1 ? 6 : -8), 'nodeLabel', 18);
    } else if(node.kind === 'tool'){
      const lines = wrapLabel(node.label, 14, 2);
      appendTextLines(g, lines, node.x, node.y + size.r + 12, 'nodeLabel', 16);
    } else if(node.kind === 'datasource'){
      /* title hidden — icon only */
    } else if(node.kind === 'llm'){
      /* title hidden — icon only */
    } else if(node.kind === 'user'){
      appendTextLines(g, wrapLabel(node.label, 18, 2), node.x, node.y + 82, 'nodeLabel', 18);
      appendTextLines(g, wrapLabel(node.subtitle || '', 28, 2), node.x, node.y + 112, 'nodeLabelSub', 16);
    } else {
      appendTextLines(g, wrapLabel(node.label, 18, 2), node.x, node.y + 50, 'nodeLabel', 18);
    }

    return g;
  }

  function edgePathBezier(p1, p2){
    const dx = p2.x - p1.x;
    const dy = p2.y - p1.y;
    const cx = p1.x + dx / 2;
    const cy = p1.y + dy / 2;
    const curve = Math.abs(dx) > 180 ? 20 : 8;
    return `M ${p1.x} ${p1.y} Q ${cx} ${cy - curve} ${p2.x} ${p2.y}`;
  }

  function edgeAnchorPoint(node, which){
    if(node.kind === 'outputDoc') return outputDocEdgeAnchor(node, which);
    return { x: node.x, y: node.y };
  }

  function edgePathForType(edge, a, b, which){
    const p1 = edgeAnchorPoint(a, which);
    const p2 = edgeAnchorPoint(b, which);
    if(edge.type === 'tool') return `M ${p1.x} ${p1.y} L ${p2.x} ${p2.y}`;
    return edgePathBezier(p1, p2);
  }

  function setNodeDetailPopoverVisible(visible){
    if(!nodeDetailPopover) return;
    nodeDetailPopover.classList.toggle('isHidden', !visible);
    nodeDetailPopover.setAttribute('aria-hidden', visible ? 'false' : 'true');

  function fillNodeDetailPopover(node){
    if(!detailTitle || !detailMeta || !detailConnections || !detailRelated) return;
    detailTitle.textContent = node.label;

    const meta = [];
    if(node.kind) meta.push(`Type: ${node.kind}`);
    if(node.layer) meta.push(`Layer: ${node.layer}`);
    if(node.group) meta.push(`Group: ${node.group}`);
    if(node.parent) meta.push(`Parent datasource: ${nodeById[node.parent] ? nodeById[node.parent].label : node.parent}`);
    fillList(detailMeta, meta.length ? meta : ['No metadata available.']);

    const edgePool = [...visibleEdgesGlean(), ...visibleEdgesCompetitor()];
    const seen = new Set();
    const direct = [];
    edgePool.forEach(e => {
      if(e.a !== node.id && e.b !== node.id) return;
      const key = e.a < e.b ? `${e.a}|${e.b}|${e.type}` : `${e.b}|${e.a}|${e.type}`;
      if(seen.has(key)) return;
      seen.add(key);
      const other = nodeById[e.a === node.id ? e.b : e.a];
      direct.push(`${e.type}: ${other ? other.label : (e.a === node.id ? e.b : e.a)}`);
    });

    fillList(detailConnections, direct.length ? direct.slice(0, 20) : ['No direct connections visible in this view.']);
    fillList(detailRelated, [...new Set(direct.map(x => x.split(': ')[1]).filter(Boolean))].slice(0, 20));
  }

  function syncNodeDetailPopover(){
    if(state.selected && nodeById[state.selected]){
      fillNodeDetailPopover(nodeById[state.selected]);
      setNodeDetailPopoverVisible(true);
    } else {
      setNodeDetailPopoverVisible(false);
    }
  }

  function mergedNodeForDraw(node, posMap){
    const p = posMap[node.id];
    if(!p) return node;
    return Object.assign({}, node, { x: p.x, y: p.y });
  }

  function ensureViewport(which){
    const svg = which === 'glean' ? gleanSvg : compSvg;
    clearElement(svg);
    const viewport = svgEl('g');
    const staticG = svgEl('g');
    const travelG = svgEl('g');
    viewport.appendChild(staticG);
    viewport.appendChild(travelG);
    svg.appendChild(viewport);
    if(which === 'glean'){
      gleanViewport = viewport;
      gleanStatic = staticG;
      gleanTravelersG = travelG;
    } else {
      compViewport = viewport;
      compStatic = staticG;
      compTravelersG = travelG;
    }
    applyCamera(which);
  }

  function applyCamera(which){
    const vp = which === 'glean' ? gleanViewport : compViewport;
    const cam = which === 'glean' ? state.cameraGlean : state.cameraComp;
    if(!vp) return;
    vp.setAttribute('transform', `translate(${cam.x} ${cam.y}) scale(${cam.scale})`);
  }

  function fitCameraToGraph(which){
    const svg = which === 'glean' ? gleanSvg : compSvg;
    const cam = which === 'glean' ? state.cameraGlean : state.cameraComp;
    const posMap = which === 'glean' ? layoutPos.glean : layoutPos.comp;
    const nodes = which === 'glean' ? visibleNodesGlean() : visibleNodesComp();
    const rect = svg.getBoundingClientRect();
    if(rect.width < 8 || rect.height < 8) return;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    nodes.forEach(n => {
      const mn = mergedNodeForDraw(n, posMap);
      const sz = nodeSize(mn);
      const padX = (sz.rect ? sz.w / 2 : sz.r) + 32;
      const padY = (sz.rect ? sz.h / 2 : sz.r) + 52;
      minX = Math.min(minX, mn.x - padX);
      maxX = Math.max(maxX, mn.x + padX);
      minY = Math.min(minY, mn.y - padY);
      maxY = Math.max(maxY, mn.y + padY);
    });
    if(!isFinite(minX)){
      if(which === 'glean'){
        minX = 0; maxX = layoutGeom.viewBoxW; minY = 0; maxY = layoutGeom.viewHeight;
      } else {
        minX = 0; maxX = 2200; minY = 0; maxY = 1800;
      }
    } else {
      const pad = 64;
      minX -= pad; maxX += pad; minY -= pad; maxY += pad;
    }
    cam.scale = which === 'glean'
      ? Math.min(GLEAN_CAMERA_MAX_SCALE, GLEAN_CAMERA_START_SCALE)
      : COMPETITOR_CAMERA_START_SCALE;
    const cx = (minX + maxX) / 2;
    const cy = (minY + maxY) / 2;
    const vb = svg.viewBox && svg.viewBox.baseVal;
    const viewCx = vb && vb.width > 0 ? vb.x + vb.width / 2 : cx;
    const viewCy = vb && vb.height > 0 ? vb.y + vb.height / 2 : cy;
    cam.x = viewCx - cx * cam.scale;
    cam.y = viewCy - cy * cam.scale;
  }

  function fitBothCameras(){
    fitCameraToGraph('glean');
    fitCameraToGraph('comp');
    applyCamera('glean');
    applyCamera('comp');
  }

  /** Glean: draw ds-glean-platform under other connectors (SVG paint order); then left→right so neighbors aren’t covered. */
  function sortGleanNodesForPaintOrder(nodes, posMap){
    const ids = (data.dataSources || []).map(d => d.id);
    const idSet = new Set(ids);
    if(!ids.length) return nodes;
    let first = -1;
    let last = -1;
    nodes.forEach((n, i) => {
      if(!idSet.has(n.id)) return;
      if(first < 0) first = i;
      last = i;
    });
    if(first < 0) return nodes;
    const xget = id => {
      const p = posMap[id];
      const n = nodeById[id];
      const x = p && p.x != null ? p.x : n && n.x;
      return x != null ? x : 0;
    };
    const dsSlice = nodes.slice(first, last + 1).sort((a, b) => {
      const ga = a.id === 'ds-glean-platform';
      const gb = b.id === 'ds-glean-platform';
      if(ga && !gb) return -1;
      if(gb && !ga) return 1;
      return xget(a.id) - xget(b.id);
    });
    return nodes.slice(0, first).concat(dsSlice).concat(nodes.slice(last + 1));
  }

  function renderOneGraph(which){
    const posMap = which === 'glean' ? layoutPos.glean : layoutPos.comp;
    const edges = which === 'glean' ? visibleEdgesGlean() : visibleEdgesCompetitor();
    let nodes = which === 'glean' ? visibleNodesGlean() : visibleNodesComp();
    if(which === 'glean') nodes = sortGleanNodesForPaintOrder(nodes, posMap);

    ensureViewport(which);
    const staticG = which === 'glean' ? gleanStatic : compStatic;

    if(which === 'glean'){
      staticG.appendChild(drawLayers());
      if(state.graphDetail !== 'collapsed'){
        drawSectionLabels(staticG);
      }
      const ux = posFromMap(data.user.id, posMap);
      if(ux && data.memories.length){
        const ringR = state.graphDetail === 'collapsed' ? 148 : 200;
        staticG.appendChild(svgEl('circle',{ cx: ux.x, cy: ux.y, r: ringR, class: 'memoryRing' }));
        const ringLabel = svgEl('text',{ x: ux.x - 110, y: ux.y - ringR - 28, class: 'ringLabel' });
        ringLabel.textContent = 'User Memories';
        staticG.appendChild(ringLabel);
      }
    }

    const edgeGroup = svgEl('g');
    edges.forEach(edge => {
      const a = mergedNodeForDraw(nodeById[edge.a], posMap);
      const b = mergedNodeForDraw(nodeById[edge.b], posMap);
      if(!nodeById[edge.a] || !nodeById[edge.b]) return;
      const path = svgEl('path',{ d: edgePathForType(edge, a, b, which), class: `edge ${edge.type}` });
      if(edge.type === 'tool') path.setAttribute('class', 'sunRay');
      edgeGroup.appendChild(path);
    });
    staticG.appendChild(edgeGroup);

    const nodeGroup = svgEl('g');
    nodes.forEach(node => {
      nodeGroup.appendChild(drawNode(mergedNodeForDraw(node, posMap), { isGlean: which === 'glean' }));
    });
    staticG.appendChild(nodeGroup);
  }

  function updateOutputDocTyping(svgRoot, docId, charCount){
    const host = svgRoot.querySelector(`[id="${docId}-typing"]`);
    if(!host) return;
    clearElement(host);
    const node = nodeById[docId];
    if(!node) return;
    const size = nodeSize(node);
    const w = size.w - 20;
    const sub = OUTPUT_DOC_PLACEHOLDER.slice(0, Math.max(0, charCount));
    const fo = svgEl('foreignObject', {
      x: node.x - size.w / 2 + 10,
      y: node.y - size.h / 2 + 42,
      width: w,
      height: size.h - 54
    });
    const div = document.createElement('div');
    div.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
    div.style.fontSize = '11px';
    div.style.lineHeight = '1.35';
    div.style.fontFamily = 'inherit';
    div.style.color = 'rgba(255,255,255,.92)';
    div.textContent = sub;
    fo.appendChild(div);
    host.appendChild(fo);
  }

  function renderStatic(opts = {}){
    layoutGlean();
    visibleNodesGlean().forEach(n => { layoutPos.glean[n.id] = { x: n.x, y: n.y }; });
    gleanSvg.setAttribute('viewBox', `0 0 ${layoutGeom.viewBoxW} ${Math.ceil(layoutGeom.viewHeight)}`);
    layoutCompetitor();
    visibleNodesComp().forEach(n => { layoutPos.comp[n.id] = { x: n.x, y: n.y }; });
    compSvg.setAttribute('viewBox', '0 0 2200 1800');

    currentVisibleNodes = visibleNodesGlean();
    currentVisibleEdges = visibleEdgesGlean();

    pageTitle.textContent = data.meta.title || `${data.user.label} Enterprise Knowledge Graph`;

    if(btnGraphCollapsed && btnGraphExpanded){
      btnGraphCollapsed.classList.toggle('active', state.graphDetail === 'collapsed');
      btnGraphExpanded.classList.toggle('active', state.graphDetail === 'expanded');
    }

    renderOneGraph('glean');
    renderOneGraph('comp');

    syncNodeDetailPopover();

    if(!opts.preserveCamera){
      state.animStartMs = performance.now();
      state.compLifecycleCycle = -1;
      state.indexPills = [];
      state.indexPillNextSpawnMs = null;
      fitBothCameras();
      const deferFit = (svgEl, attempts) => {
        if(attempts <= 0) return;
        requestAnimationFrame(() => {
          const r = svgEl.getBoundingClientRect();
          if(r.width >= 8 && r.height >= 8){
            fitBothCameras();
          } else deferFit(svgEl, attempts - 1);
        });
      };
      deferFit(gleanSvg, 16);
    }
    renderTravelers();
  }

  function updateGleanTravelerVisitGlow(visitedIds){
    if(!gleanSvg) return;
    const uid = data.user.id;
    gleanSvg.querySelectorAll('[data-node-id]').forEach(el => {
      const id = el.getAttribute('data-node-id');
      const on = !!(visitedIds && visitedIds.has(id) && id !== uid);
      el.classList.toggle('travelerVisitHighlight', on);
    });
  }

  function updateAndDrawIndexPills(now, posMap){
    const band = layoutGeom.enterpriseKnowledgeLayer;
    if(!gleanTravelersG || !band) return;
    const dsList = (data.dataSources || []).filter(ds => nodeById[ds.id]);
    if(!dsList.length){
      state.indexPills = [];
      return;
    }
    if(state.indexPillNextSpawnMs == null) state.indexPillNextSpawnMs = now;
    let spawned = 0;
    while(state.indexPillNextSpawnMs <= now && spawned < 120){
      const ds = dsList[Math.floor(Math.random() * dsList.length)];
      const offsetX = (Math.random() * 2 - 1) * DS_NODE_R_FOR_PILLS;
      state.indexPills.push({
        dsId: ds.id,
        spawnOffsetX: offsetX,
        startMs: state.indexPillNextSpawnMs
      });
      state.indexPillNextSpawnMs += INDEX_PILL_SPAWN_MS;
      spawned++;
    }
    state.indexPills = state.indexPills.filter(p => now - p.startMs <= INDEX_PILL_DURATION_MS + 100);
    state.indexPills.forEach(pill => {
      const p = posFromMap(pill.dsId, posMap);
      if(!p) return;
      const age = now - pill.startMs;
      const t = Math.min(1, Math.max(0, age / INDEX_PILL_DURATION_MS));
      const ease = t * t * (3 - 2 * t);
      const ox = pill.spawnOffsetX != null ? pill.spawnOffsetX : 0;
      const yStart = p.y - DS_NODE_R_FOR_PILLS;
      const yEnd = band.y + band.h - 14;
      const x = p.x + ox;
      const y = yStart + (yEnd - yStart) * ease;
      let op = 1;
      if(t > 0.64) op = Math.max(0, 1 - (t - 0.64) / 0.36);
      const gg = svgEl('g', { opacity: String(op) });
      gg.appendChild(svgEl('rect', {
        x: x - 3.5,
        y: y - 7,
        width: 7,
        height: 14,
        rx: 3.5,
        ry: 3.5,
        class: 'indexPill'
      }));
      gleanTravelersG.appendChild(gg);
    });
  }

  function renderTravelers(){
    if(!gleanTravelersG || !compTravelersG) return;
    const now = performance.now();
    refreshLifecycleRandomPicks(now);
    const gVis = gleanLifecycleVisual(now, state.animStartMs, layoutPos.glean);
    const cVis = competitorLifecycleVisual(now, state.animStartMs, layoutPos.comp, state.compLifecycleTrios);

    updateGleanTravelerVisitGlow(gVis.visitedIds);

    clearElement(gleanTravelersG);
    gVis.circles.forEach(pos => {
      gleanTravelersG.appendChild(svgEl('circle', { cx: pos.x, cy: pos.y, r: TRAVELER_R_GLEAN, class: pos.cls }));
    });
    updateAndDrawIndexPills(now, layoutPos.glean);
    clearElement(compTravelersG);
    cVis.circles.forEach(pos => {
      compTravelersG.appendChild(svgEl('circle', { cx: pos.x, cy: pos.y, r: TRAVELER_R_COMP, class: pos.cls }));
    });

    updateOutputDocTyping(gleanSvg, GLEAN_OUTPUT_DOC_ID, gVis.docCharCount);
    updateOutputDocTyping(compSvg, COMP_OUTPUT_DOC_ID, cVis.docCharCount);
  }

  function svgPointFromEvent(evt, svg){
    const pt = svg.createSVGPoint();
    pt.x = evt.clientX;
    pt.y = evt.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }

  function bindSvgInteractions(svg, which){
    const cam = () => which === 'glean' ? state.cameraGlean : state.cameraComp;
    const minS = which === 'glean' ? GLEAN_CAMERA_MIN_SCALE : 0.55;
    const maxS = which === 'glean' ? GLEAN_CAMERA_MAX_SCALE : 2.6;

    svg.addEventListener('pointerdown', evt => {
      const clickedNode = typeof evt.target.closest === 'function' && evt.target.closest('.node');
      if(clickedNode) return;
      state.isPanning = true;
      state.panSvg = which;
      stageWrap.classList.add('dragging');
      state.panStart = {
        point: svgPointFromEvent(evt, svg),
        x: cam().x,
        y: cam().y
      };
      svg.setPointerCapture(evt.pointerId);
    });

    svg.addEventListener('pointermove', evt => {
      if(!state.isPanning || !state.panStart || state.panSvg !== which) return;
      const p = svgPointFromEvent(evt, svg);
      const c = cam();
      c.x = state.panStart.x + (p.x - state.panStart.point.x);
      c.y = state.panStart.y + (p.y - state.panStart.point.y);
      applyCamera(which);
    });

    function endPan(evt){
      if(state.panSvg !== which) return;
      state.isPanning = false;
      state.panStart = null;
      state.panSvg = null;
      stageWrap.classList.remove('dragging');
      if(evt && svg.hasPointerCapture && svg.hasPointerCapture(evt.pointerId)){
        svg.releasePointerCapture(evt.pointerId);
      }
    }

    svg.addEventListener('pointerup', endPan);
    svg.addEventListener('pointercancel', endPan);

    svg.addEventListener('wheel', evt => {
      evt.preventDefault();
      const p = svgPointFromEvent(evt, svg);
      const c = cam();
      const worldX = (p.x - c.x) / c.scale;
      const worldY = (p.y - c.y) / c.scale;
      const factor = evt.deltaY < 0 ? 1.1 : 0.9;
      const newScale = Math.max(minS, Math.min(maxS, c.scale * factor));
      c.x = p.x - worldX * newScale;
      c.y = p.y - worldY * newScale;
      c.scale = newScale;
      applyCamera(which);
    }, { passive: false });

    svg.addEventListener('click', evt => {
      const clickedNode = typeof evt.target.closest === 'function' && evt.target.closest('.node');
      if(clickedNode) return;
      state.selected = null;
      renderStatic({ preserveCamera: true });
    });
  }

  bindSvgInteractions(gleanSvg, 'glean');
  bindSvgInteractions(compSvg, 'comp');

  if(btnGraphCollapsed){
    btnGraphCollapsed.addEventListener('click', () => {
      if(state.graphDetail === 'collapsed') return;
      state.graphDetail = 'collapsed';
      state.selected = null;
      renderStatic();
    });
  }
  if(btnGraphExpanded){
    btnGraphExpanded.addEventListener('click', () => {
      if(state.graphDetail === 'expanded') return;
      state.graphDetail = 'expanded';
      state.selected = null;
      renderStatic();
    });
  }

  btnReset.addEventListener('click', () => {
    state.selected = null;
    renderStatic();
  });

  if(nodeDetailClose){
    nodeDetailClose.addEventListener('click', () => {
      state.selected = null;
      renderStatic({ preserveCamera: true });
    });
  }

  function animate(){
    renderTravelers();
    requestAnimationFrame(animate);
  }

  renderStatic();
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
