<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Enterprise Knowledge Graph Context Engine</title>
<style>
  :root{
    --blue:#343CED;
    --green:#D8FD49;
    --oatmeal:#F6F3EB;
    --black:#000000;
    --white:#FFFFFF;
    --radius:22px;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"DM Sans",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--oatmeal);
    color:var(--black);
    overflow:hidden;
  }

  .app{
    height:100vh;
    min-height:0;
    display:grid;
    grid-template-columns:minmax(0,1fr);
    grid-template-rows:minmax(0,1fr);
    gap:16px;
    padding:16px;
  }

  .main{
    min-width:0;
    min-height:0;
    display:grid;
    grid-template-rows:auto minmax(0,1fr);
    gap:16px;
  }

  .card{
    background:var(--white);
    border:1.5px solid var(--black);
    border-radius:var(--radius);
  }

  .toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:14px 18px;
  }

  .brandWrap{
    display:flex;
    align-items:center;
    gap:14px;
    min-width:0;
  }

  .brandMark{
    display:grid;
    place-items:center;
    width:44px;
    height:44px;
    border-radius:14px;
    background:var(--blue);
    color:var(--white);
    font-weight:800;
    font-size:20px;
    flex:0 0 auto;
  }

  .brandText{min-width:0}
  .brandEyebrow{
    margin:0 0 2px;
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;
  }
  .brandTitle{
    margin:0;
    font-size:20px;
    line-height:1.05;
    font-weight:800;
  }
  .brandSub{
    margin:4px 0 0;
    font-size:13px;
    line-height:1.35;
    opacity:.78;
  }

  .controls{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:nowrap;
    justify-content:flex-end;
    flex-shrink:0;
  }

  .segmented{
    display:inline-flex;
    padding:4px;
    background:var(--oatmeal);
    border:1.5px solid var(--black);
    border-radius:999px;
    gap:4px;
  }

  .segmented button,
  .ghostBtn{
    appearance:none;
    border:none;
    background:transparent;
    color:var(--black);
    font:inherit;
    cursor:pointer;
  }

  .segmented button{
    padding:10px 14px;
    border-radius:999px;
    font-weight:700;
  }

  .segmented button.active{
    background:var(--blue);
    color:var(--white);
  }

  .ghostBtn{
    padding:10px 12px;
    border:1.5px solid var(--black);
    border-radius:12px;
    background:var(--white);
    font-weight:700;
  }

  .stageWrap{
    position:relative;
    overflow:hidden;
    min-height:0;
    cursor:grab;
    user-select:none;
  }

  .stageWrap.dragging{ cursor:grabbing; }

  #stageSvg{
    display:block;
    width:100%;
    height:100%;
    background:var(--white);
    touch-action:none;
  }

  .hud{
    position:absolute;
    left:16px;
    bottom:16px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    max-width:calc(100% - 32px);
    pointer-events:none;
  }

  .pill{
    padding:8px 12px;
    border:1.5px solid var(--black);
    border-radius:999px;
    background:var(--white);
    font-size:12px;
    font-weight:700;
  }

  .nodeDetailPopover{
    position:absolute;
    top:16px;
    right:16px;
    z-index:30;
    width:min(380px,calc(100% - 32px));
    max-height:calc(100% - 32px);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    box-shadow:8px 12px 0 rgba(0,0,0,.08);
    pointer-events:auto;
  }

  .nodeDetailPopover.isHidden{
    display:none;
  }

  .nodeDetailHead{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    padding:16px 16px 0;
  }

  .nodeDetailHead .panelEyebrow{margin:0}

  .nodeDetailClose{
    appearance:none;
    border:1.5px solid var(--black);
    border-radius:10px;
    background:var(--white);
    width:36px;
    height:36px;
    font-size:22px;
    line-height:1;
    font-weight:800;
    cursor:pointer;
    flex-shrink:0;
    display:grid;
    place-items:center;
    padding:0;
  }

  .nodeDetailBody{
    flex:1 1 auto;
    overflow:auto;
    padding:12px 18px 18px;
    min-height:0;
  }

  .panelEyebrow{
    margin:0 0 8px;
    font-size:12px;
    font-weight:800;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--blue);
  }

  .panelTitle{
    margin:0;
    font-size:24px;
    line-height:1.05;
    font-weight:900;
  }

  .section{margin-top:18px}
  .section h3{
    margin:0 0 8px;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.08em;
    font-weight:900;
    color:var(--blue);
  }

  .section p,.section li{
    font-size:14px;
    line-height:1.45;
    margin:0;
  }

  .section ul{
    margin:0;
    padding-left:18px;
  }

  .layerBand{
    fill:none;
    stroke:var(--black);
    stroke-width:4;
    opacity:.5;
  }

  .memoryRing{
    fill:none;
    stroke:var(--blue);
    stroke-width:2;
    stroke-dasharray:8 10;
    opacity:.45;
  }

  .bandLabel{
    font-size:20px;
    font-weight:900;
    fill:var(--blue);
    letter-spacing:.06em;
    text-transform:uppercase;
  }

  .bandSub{
    font-size:16px;
    font-weight:500;
    fill:var(--black);
    opacity:.72;
  }

  .ringLabel{
    font-size:14px;
    font-weight:900;
    fill:var(--blue);
    letter-spacing:.08em;
    text-transform:uppercase;
  }

  .sectionLabel{
    font-size:16px;
    font-weight:900;
    fill:var(--blue);
    letter-spacing:.08em;
    text-transform:uppercase;
  }

  .edge{
    fill:none;
    stroke:var(--blue);
    opacity:.3;
    stroke-width:4;
  }

  .edge.memory{opacity:.28}
  .edge.bridge{opacity:.18;stroke-width:1.2}
  .edge.tool{opacity:.18}
  .edge.llm{opacity:.24;stroke-width:1.4}
  .edge.competitor{opacity:.22;stroke-width:1.5;stroke-dasharray:8 8}

  .node{cursor:pointer}
  .node .shape{
    stroke:var(--black);
    stroke-width:1.6;
    fill:var(--white);
  }

  .node.user .shape{fill:var(--blue)}
  .node.memory .shape{fill:var(--green)}
  .node.tool .shape,
  .node.team .shape,
  .node.llm .shape{fill:var(--oatmeal)}
  .node.datasource .shape{fill:var(--white)}

  .node.selected .shape{
    stroke:var(--blue);
    stroke-width:3;
  }

  .nodeLabel{
    font-size:16px;
    font-weight:800;
    text-anchor:middle;
    fill:var(--black);
    pointer-events:none;
  }

  .nodeLabelSub{
    font-size:14px;
    font-weight:500;
    text-anchor:middle;
    fill:var(--black);
    opacity:.72;
    pointer-events:none;
  }

  .node.user .nodeLabel,
  .node.user .nodeLabelSub{fill:var(--black)}

  .iconStroke{
    stroke:var(--blue);
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
    fill:none;
    pointer-events:none;
  }

  .iconFill{
    fill:var(--blue);
    pointer-events:none;
  }

  .node.user .iconStroke{stroke:var(--white)}
  .node.user .iconFill{fill:var(--white)}

  .traveler{
    fill:var(--green);
    stroke:var(--black);
    stroke-width:1;
  }

  .llmTraveler{
    fill:var(--blue);
    stroke:var(--black);
    stroke-width:1;
  }

  .sunRay{
    stroke:var(--blue);
    opacity:.16;
    stroke-width:1.1;
    fill:none;
  }

  .graphDetailSeg{margin-left:8px}
  .graphDetailSeg.isHidden{display:none}

  @media (max-width:720px){
    .nodeDetailPopover{
      width:min(100%,calc(100% - 24px));
      right:12px;
      top:12px;
      max-height:calc(100% - 24px);
    }
  }
</style>
</head>
<body>
<div class="app">
  <div class="main">
    <div class="toolbar card">
      <div class="brandWrap">
        <div class="brandMark">G</div>
        <div class="brandText">
          <p class="brandEyebrow">Glean™ Context Engine</p>
          <h1 class="brandTitle" id="pageTitle">Enterprise Knowledge Graph</h1>
        </div>
      </div>
      <div class="controls">
        <div class="segmented">
          <button id="btnGlean" class="active">Glean's Context</button>
          <button id="btnCompetitor">Competitor's Context</button>
        </div>
        <div class="segmented graphDetailSeg" id="graphDetailWrap" aria-label="Graph detail level">
          <button type="button" id="btnGraphCollapsed" class="active">Summary</button>
          <button type="button" id="btnGraphExpanded">Full graph</button>
        </div>
        <button class="ghostBtn" id="btnReset">Reset</button>
      </div>
    </div>

    <div class="stageWrap card" id="stageWrap">
      <svg id="stageSvg" viewBox="0 0 2000 3300" preserveAspectRatio="xMidYMid meet" aria-label="Interactive enterprise knowledge graph"></svg>
      <div class="hud">
        <div class="pill" id="hudMode">Mode: Glean's Context</div>
        <div class="pill" id="hudCounts">0 nodes · 0 edges</div>
        <div class="pill" id="hudCamera">100% · drag to pan · wheel to zoom</div>
      </div>
      <div class="nodeDetailPopover card isHidden" id="nodeDetailPopover" role="dialog" aria-modal="false" aria-labelledby="detailTitle" aria-hidden="true">
        <div class="nodeDetailHead">
          <p class="panelEyebrow">Node details</p>
          <button type="button" class="nodeDetailClose" id="nodeDetailClose" aria-label="Close details">×</button>
        </div>
        <div class="nodeDetailBody">
          <h2 class="panelTitle" id="detailTitle"></h2>
          <div class="section">
            <h3>Layer and tags</h3>
            <ul id="detailMeta"></ul>
          </div>
          <div class="section">
            <h3>Direct connections</h3>
            <ul id="detailConnections"></ul>
          </div>
          <div class="section">
            <h3>Related nodes</h3>
            <ul id="detailRelated"></ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const TEMPLATE_GRAPH_DATA = window.KNOWLEDGE_GRAPH_DATA || {
    meta:{
      title:"Enterprise Knowledge Graph",
      subtitle:""
    },
    user:{
      id:"user-current",
      label:"Current User",
      subtitle:"Role",
      kind:"user",
      layer:"user",
      group:"user",
      desc:"Profile node for the current user.",
      icon:"user"
    },
    llms:[
      {id:"llm-openai",label:"OpenAI",kind:"llm",layer:"llm",group:"llm",desc:"LLM provider",icon:"cpu"},
      {id:"llm-anthropic",label:"Anthropic",kind:"llm",layer:"llm",group:"llm",desc:"LLM provider",icon:"cpu"},
      {id:"llm-gemini",label:"Gemini",kind:"llm",layer:"llm",group:"llm",desc:"LLM provider",icon:"cpu"}
    ],
    memories:[],
    people:[],
    projects:[],
    meetings:[],
    documents:[],
    orgNodes:[],
    enterpriseDocuments:[],
    partners:[],
    dataSources:[],
    actions:[],
    edges:[]
  };

  const svg = document.getElementById('stageSvg');
  const stageWrap = document.getElementById('stageWrap');
  const btnGlean = document.getElementById('btnGlean');
  const btnCompetitor = document.getElementById('btnCompetitor');
  const btnReset = document.getElementById('btnReset');
  const graphDetailWrap = document.getElementById('graphDetailWrap');
  const btnGraphCollapsed = document.getElementById('btnGraphCollapsed');
  const btnGraphExpanded = document.getElementById('btnGraphExpanded');
  const hudMode = document.getElementById('hudMode');
  const hudCounts = document.getElementById('hudCounts');
  const hudCamera = document.getElementById('hudCamera');

  const pageTitle = document.getElementById('pageTitle');
  const nodeDetailPopover = document.getElementById('nodeDetailPopover');
  const nodeDetailClose = document.getElementById('nodeDetailClose');
  const detailTitle = document.getElementById('detailTitle');
  const detailMeta = document.getElementById('detailMeta');
  const detailConnections = document.getElementById('detailConnections');
  const detailRelated = document.getElementById('detailRelated');

  const data = normalizeData(TEMPLATE_GRAPH_DATA);

  const state = {
    view:'glean',
    graphDetail:'collapsed',
    selected:null,
    camera:{x:0,y:0,scale:1},
    isPanning:false,
    panStart:null
  };

  const layoutGeom = {
    viewHeight:3300,
    viewBoxX:0,
    viewBoxW:2000,
    layers:[],
    bandTexts:[],
    sections:[]
  };

  const nodeById = {};
  let allNodes = [];
  let currentVisibleNodes = [];
  let currentVisibleEdges = [];
  let viewport, staticGroup, travelerGroup;

  /** Pixels per second — all traveling dots (Glean + competitor). */
  const TRAVELER_SPEED = 420;
  const GLEAN_TRAVELER_COUNT = 50;
  const GLEAN_TRAVELER_STAGGER_MS = 10000;
  /** Competitor view: one original traveler plus nine more; all start within 10s of graph load. */
  const COMPETITOR_TRAVELER_COUNT = 10;
  const COMPETITOR_TRAVELER_STAGGER_MS = 10000;

  /** Glean view: initial HUD zoom 100%, wheel capped at 200%. */
  const GLEAN_CAMERA_START_SCALE = 1;
  const GLEAN_CAMERA_MAX_SCALE = 2;
  const GLEAN_CAMERA_MIN_SCALE = 0.35;
  /** Competitor view: start at 100% zoom (1:1 world units vs viewBox). */
  const COMPETITOR_CAMERA_START_SCALE = 1;
  /** LLM row: rect width (must match nodeSize) and X gap between adjacent LLM cards. */
  const LLM_NODE_RECT_W = 170;
  const LLM_NODE_GAP_X = 10;

  let gleanTravelers = null;
  let competitorTravelers = null;
  let travelerViewMode = null;
  let travelerGraphDetail = null;
  let travelerGeomStale = false;

  const COLLAPSE_HUB_ORDER = [
    'hub-pers-people','hub-pers-projects','hub-pers-meetings','hub-pers-documents',
    'hub-ent-teams','hub-ent-edocs','hub-ent-partners','hub-ent-datasources'
  ];

  const SECTION_HUB_SPECS = [
    { id:'hub-pers-people', layer:'personal', group:'people', title:'People', listKey:'people' },
    { id:'hub-pers-projects', layer:'personal', group:'projects', title:'Projects', listKey:'projects' },
    { id:'hub-pers-meetings', layer:'personal', group:'meetings', title:'Meetings', listKey:'meetings' },
    { id:'hub-pers-documents', layer:'personal', group:'docs', title:'Documents', listKey:'documents' },
    { id:'hub-ent-teams', layer:'enterprise', group:'teams', title:'Teams', listKey:'orgNodes' },
    { id:'hub-ent-edocs', layer:'enterprise', group:'enterpriseDocs', title:'Enterprise docs', listKey:'enterpriseDocuments' },
    { id:'hub-ent-partners', layer:'enterprise', group:'partners', title:'Partners', listKey:'partners' },
    { id:'hub-ent-datasources', layer:'enterprise', group:'datasources', title:'Data sources + tools', listKey:'dataSources' }
  ];

  function ensureSectionHubNodes(){
    SECTION_HUB_SPECS.forEach(s => {
      const list = data[s.listKey] || [];
      const n = list.length;
      const node = nodeById[s.id] || { id: s.id };
      Object.assign(node, {
        id: s.id,
        label: `${s.title} (${n})`,
        subtitle: n === 1 ? '1 node' : `${n} nodes`,
        kind: 'sectionHub',
        layer: s.layer,
        group: s.group,
        icon: 'layers',
        desc: `Collapsed summary for ${s.title}: ${n} ${n === 1 ? 'item' : 'items'}. Switch to Full graph to inspect each node.`,
        x: node.x || 0,
        y: node.y || 0
      });
      nodeById[s.id] = node;
    });
  }

  function randomPathInt(n){
    return Math.floor(Math.random() * n);
  }

  function shufflePathIds(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildAdjacencyNoLlm(){
    const adj = {};
    const link = (x, y) => {
      if(!adj[x]) adj[x] = [];
      if(!adj[y]) adj[y] = [];
      if(!adj[x].includes(y)){
        adj[x].push(y);
        adj[y].push(x);
      }
    };
    currentVisibleEdges.forEach(e => {
      const A = nodeById[e.a];
      const B = nodeById[e.b];
      if(!A || !B) return;
      if(A.kind === 'llm' || B.kind === 'llm') return;
      link(e.a, e.b);
    });
    return adj;
  }

  function bfsPathOnAdj(adj, start, goal){
    if(start === goal) return [start];
    const queue = [[start]];
    const seen = new Set([start]);
    while(queue.length){
      const path = queue.shift();
      const cur = path[path.length - 1];
      for(const nxt of adj[cur] || []){
        if(seen.has(nxt)) continue;
        if(nxt === goal) return path.concat(nxt);
        seen.add(nxt);
        queue.push(path.concat(nxt));
      }
    }
    return null;
  }

  function isPersonalKgNode(n){
    return n && (n.kind === 'memory' || n.layer === 'personal');
  }

  function enterpriseNodeIds(){
    return visibleNodes().filter(n => n.layer === 'enterprise').map(n => n.id);
  }

  function randomWalkNoLlm(adj, start, steps){
    const path = [start];
    let cur = start;
    for(let i = 0; i < steps; i++){
      const nbrs = (adj[cur] || []).filter(id => nodeById[id] && nodeById[id].kind !== 'llm');
      if(!nbrs.length) break;
      const prev = path.length >= 2 ? path[path.length - 2] : null;
      const prefer = prev ? nbrs.filter(x => x !== prev) : nbrs;
      const pickFrom = prefer.length ? prefer : nbrs;
      const nxt = pickFrom[randomPathInt(pickFrom.length)];
      path.push(nxt);
      cur = nxt;
    }
    return path;
  }

  function concatNodePaths(parts){
    const out = [];
    parts.forEach(p => {
      if(!p || !p.length) return;
      if(!out.length) out.push(...p);
      else if(out[out.length - 1] === p[0]) out.push(...p.slice(1));
      else out.push(...p);
    });
    return out;
  }

  function buildGleanTravelPath(){
    const uid = data.user.id;
    const adj = buildAdjacencyNoLlm();
    const perNbrs = (adj[uid] || []).filter(id => isPersonalKgNode(nodeById[id]));
    const entIds = enterpriseNodeIds();
    const parts = [];

    if(perNbrs.length){
      const p0 = perNbrs[randomPathInt(perNbrs.length)];
      parts.push([uid, p0]);
      const walk = randomWalkNoLlm(adj, p0, 2 + randomPathInt(5));
      parts.push(walk.slice(1));
      const walkEnd = walk[walk.length - 1];
      const atEnt = nodeById[walkEnd] && nodeById[walkEnd].layer === 'enterprise';
      if(entIds.length && !atEnt){
        let hop = null;
        for(const eid of shufflePathIds(entIds)){
          hop = bfsPathOnAdj(adj, walkEnd, eid);
          if(hop && hop.length > 1) break;
        }
        if(hop) parts.push(hop.slice(1));
      }
      const tail = parts.length ? parts[parts.length - 1] : null;
      let curBack = Array.isArray(tail) ? tail[tail.length - 1] : uid;
      if(typeof curBack !== 'string') curBack = uid;
      const back = bfsPathOnAdj(adj, curBack, uid);
      if(back && back.length > 1) parts.push(back.slice(1));
    } else if(entIds.length){
      const e0 = entIds[randomPathInt(entIds.length)];
      const toEnt = bfsPathOnAdj(adj, uid, e0);
      if(toEnt) parts.push(toEnt);
      const back = bfsPathOnAdj(adj, e0, uid);
      if(back && back.length > 1) parts.push(back.slice(1));
    }

    const llmIds = data.llms.map(l => l.id).filter(id => nodeById[id]);
    if(llmIds.length){
      const L = llmIds[randomPathInt(llmIds.length)];
      parts.push([uid, L, uid]);
    }

    let path = concatNodePaths(parts);
    if(path.length < 2 && llmIds.length) path = [uid, llmIds[0], uid];
    if(path.length < 2) path = [uid];
    return path;
  }

  function buildCompetitorTravelPath(){
    const uid = data.user.id;
    const dss = data.dataSources || [];
    if(!dss.length) return [uid, 'comp-llm', uid];
    const ds = dss[randomPathInt(dss.length)];
    return [uid, 'comp-llm', ds.id, 'comp-llm', uid];
  }

  function pathGeomFromIds(ids){
    const pts = [];
    ids.forEach(id => {
      const n = nodeById[id];
      if(n) pts.push({ x: n.x, y: n.y, id });
    });
    if(pts.length < 2) return { pts, segs: [], total: 0 };
    const segs = [];
    let total = 0;
    for(let i = 0; i < pts.length - 1; i++){
      const dx = pts[i + 1].x - pts[i].x;
      const dy = pts[i + 1].y - pts[i].y;
      const len = Math.hypot(dx, dy);
      const na = nodeById[pts[i].id];
      const nb = nodeById[pts[i + 1].id];
      const llmLeg = na && nb && (na.kind === 'llm' || nb.kind === 'llm');
      segs.push({ len, llmLeg });
      total += len;
    }
    return { pts, segs, total };
  }

  function positionOnPathGeom(geom, distAlong){
    if(!geom.pts.length) return { x: 0, y: 0, cls: 'traveler' };
    if(geom.total < 1e-6) return { x: geom.pts[0].x, y: geom.pts[0].y, cls: 'traveler' };
    let d = distAlong;
    for(let i = 0; i < geom.segs.length; i++){
      const sl = geom.segs[i].len;
      const lastSeg = i === geom.segs.length - 1;
      if(d <= sl || lastSeg){
        const t = sl > 1e-9 ? Math.min(1, d / sl) : 0;
        const p0 = geom.pts[i];
        const p1 = geom.pts[i + 1];
        return {
          x: p0.x + (p1.x - p0.x) * t,
          y: p0.y + (p1.y - p0.y) * t,
          cls: geom.segs[i].llmLeg ? 'llmTraveler' : 'traveler'
        };
      }
      d -= sl;
    }
    const last = geom.pts[geom.pts.length - 1];
    return { x: last.x, y: last.y, cls: 'traveler' };
  }

  function createGleanTraveler(now){
    const tr = {
      birthRef: now,
      delayMs: Math.random() * GLEAN_TRAVELER_STAGGER_MS,
      cycleStartMs: null,
      pathIds: [],
      geom: { pts: [], segs: [], total: 0 },
      regen(){
        this.pathIds = buildGleanTravelPath();
        this.geom = pathGeomFromIds(this.pathIds);
      }
    };
    tr.regen();
    return tr;
  }

  function createCompetitorTraveler(now){
    const tr = {
      birthRef: now,
      delayMs: Math.random() * COMPETITOR_TRAVELER_STAGGER_MS,
      cycleStartMs: null,
      pathIds: [],
      geom: { pts: [], segs: [], total: 0 },
      regen(){
        this.pathIds = buildCompetitorTravelPath();
        this.geom = pathGeomFromIds(this.pathIds);
      }
    };
    tr.regen();
    return tr;
  }

  function sampleTravelerMotion(tr, now){
    const uid = data.user.id;
    const u = nodeById[uid];
    const fallback = { x: u ? u.x : 0, y: u ? u.y : 0, cls: 'traveler' };
    if(!tr.geom || tr.geom.total < 1e-6){
      tr.regen();
      if(!tr.geom || tr.geom.total < 1e-6) return fallback;
    }
    if(now < tr.birthRef + tr.delayMs) return fallback;
    if(tr.cycleStartMs === null) tr.cycleStartMs = now;
    const speed = TRAVELER_SPEED / 1000;
    let dist = (now - tr.cycleStartMs) * speed;
    while(dist >= tr.geom.total && tr.geom.total > 1e-6){
      tr.regen();
      tr.cycleStartMs = now;
      dist = 0;
    }
    return positionOnPathGeom(tr.geom, dist);
  }

  function normalizeData(raw){
    const normalized = {
      meta: raw.meta || {},
      user: raw.user || {id:'user-current',label:'Current User',subtitle:'Role',kind:'user',layer:'user',group:'user',desc:'Profile node'},
      llms: raw.llms && raw.llms.length ? raw.llms : [
        {id:'llm-openai',label:'OpenAI',kind:'llm',layer:'llm',group:'llm',desc:'LLM provider',icon:'cpu'},
        {id:'llm-anthropic',label:'Anthropic',kind:'llm',layer:'llm',group:'llm',desc:'LLM provider',icon:'cpu'},
        {id:'llm-gemini',label:'Gemini',kind:'llm',layer:'llm',group:'llm',desc:'LLM provider',icon:'cpu'}
      ],
      memories: raw.memories || [],
      people: raw.people || [],
      projects: raw.projects || [],
      meetings: raw.meetings || [],
      documents: raw.documents || [],
      orgNodes: raw.orgNodes || [],
      enterpriseDocuments: raw.enterpriseDocuments || [],
      partners: raw.partners || [],
      dataSources: raw.dataSources || [],
      actions: raw.actions || [],
      edges: raw.edges || []
    };

    const annotate = (arr, defaults) => arr.map((node, index) => Object.assign({
      id: `${defaults.group}-${index+1}`,
      label: defaults.label || 'Node',
      subtitle:'',
      desc:'',
      kind: defaults.kind,
      layer: defaults.layer,
      group: defaults.group,
      icon: defaults.icon || 'circle',
      parent:'',
      x:0,
      y:0
    }, node));

    normalized.user = Object.assign({
      kind:'user',
      layer:'user',
      group:'user',
      icon:'user',
      x:0,
      y:0
    }, normalized.user);

    normalized.llms = annotate(normalized.llms, {kind:'llm',layer:'llm',group:'llm',icon:'cpu'});
    normalized.memories = annotate(normalized.memories, {kind:'memory',layer:'user',group:'memory',icon:'database'});
    normalized.people = annotate(normalized.people, {kind:'person',layer:'personal',group:'people',icon:'user'});
    normalized.projects = annotate(normalized.projects, {kind:'project',layer:'personal',group:'projects',icon:'target'});
    normalized.meetings = annotate(normalized.meetings, {kind:'meeting',layer:'personal',group:'meetings',icon:'calendar'});
    normalized.documents = annotate(normalized.documents, {kind:'doc',layer:'personal',group:'docs',icon:'file-text'});
    normalized.orgNodes = annotate(normalized.orgNodes, {kind:'team',layer:'enterprise',group:'teams',icon:'building'});

    normalized.actions = annotate(normalized.actions, {kind:'tool',layer:'enterprise',group:'tools',icon:'cpu'});

    return normalized;
  }

  function rebuildNodes(){
    allNodes = [

      ...data.documents,

  function collapsedGleanEdges(){
    const uid = data.user.id;
    const edges = [];
    const t = 'bridge';
    const pers = ['hub-pers-people','hub-pers-projects','hub-pers-meetings','hub-pers-documents'];
    const ent = ['hub-ent-teams','hub-ent-edocs','hub-ent-partners','hub-ent-datasources'];
    const link = (a, b) => edges.push({ a, b, type: t });
    pers.forEach(id => { if(nodeById[id]) link(uid, id); });
    ent.forEach(id => { if(nodeById[id]) link(uid, id); });
    for(let i = 0; i < pers.length - 1; i++){
      if(nodeById[pers[i]] && nodeById[pers[i + 1]]) link(pers[i], pers[i + 1]);
    }
    for(let i = 0; i < ent.length - 1; i++){
      if(nodeById[ent[i]] && nodeById[ent[i + 1]]) link(ent[i], ent[i + 1]);
    }
    if(nodeById[pers[pers.length - 1]] && nodeById[ent[0]]) link(pers[pers.length - 1], ent[0]);
    data.llms.forEach(llm => {
      if(nodeById[llm.id]) link(llm.id, uid);
    });
    return edges;
  }

    if(state.view === 'competitor'){
      return data.dataSources.map(ds => ({a:data.user.id,b:ds.id,type:'competitor'}))
        .concat(data.dataSources.map(ds => ({a:'comp-llm',b:ds.id,type:'competitor'})))
        .concat([{a:data.user.id,b:'comp-llm',type:'competitor'}]);
    }
    if(state.graphDetail === 'collapsed') return collapsedGleanEdges();
    return (data.edges || []).map(edge => ({
      a: edge.a || edge.source,

      type: edge.type || edge.kind || 'bridge'
    })).filter(edge => nodeById[edge.a] && nodeById[edge.b]);
  }

  const WRITING_CONTEXT_ID = 'action-writing-context';

  function gridAssign(list,x0,x1,y0,stepY,cols){
    const c = Math.max(1, cols);
    const stepX = c > 1 ? (x1 - x0) / (c - 1) : 0;
    list.forEach((n,i)=>{
      const col = i % c;
      const row = Math.floor(i / c);
      n.x = x0 + stepX * col;
      n.y = y0 + stepY * row;
    });
  }

  function gridAssignPacked(list,x0,x1,y0,stepY,cols,tight){
    const t = tight != null ? tight : 0.86;
    const mid = (x0 + x1) / 2;
    const span = (x1 - x0) * t;
    gridAssign(list, mid - span / 2, mid + span / 2, y0, stepY, cols);
  }

  function llmAssignFixedGap(list, x0, x1, y, edgePad){
    const n = list.length;
    if(!n) return;
    const pad = edgePad != null ? edgePad : 36;
    const lo = x0 + pad;
    const hi = x1 - pad;
    const mid = (lo + hi) / 2;
    const w = LLM_NODE_RECT_W;
    const g = LLM_NODE_GAP_X;
    if(n === 1){
      list[0].x = mid;
      list[0].y = y;
      return;
    }
    const clusterW = n * w + (n - 1) * g;
    const left = mid - clusterW / 2;
    list.forEach((node, i) => {
      node.x = left + w / 2 + i * (w + g);
      node.y = y;
    });
  }

  function colsForCount(n){
    if(n <= 0) return 1;
    return Math.max(1, Math.min(18, Math.ceil(Math.sqrt(n * 5.6))));
  }

  function gridBlockHeight(n, cols, rowStep){
    if(n <= 0) return 0;
    return Math.ceil(n / Math.max(1, cols)) * rowStep;
  }

  function layoutGlean(){
    const CX = 1000;
    const LAYER_MIN_W = 960;
    const LAYER_MAX_W = 1960;
    const LAYER_RX = 28;
    const LAYER_GAP = 26;
    const SECTION_GAP = 18;
    const LABEL_COL_W = 152;

    const ROW_LLM = 76;
    const DS_ROW = 198;
    const TOOL_HALO = 88;
    const SEC_LABEL_TOP = 14;
    const SEC_GRID_TOP = 48;

    function pyramidWidth(layerIdx){
      const base = LAYER_MIN_W + (LAYER_MAX_W - LAYER_MIN_W) * (layerIdx / 3);
      return layerIdx >= 2 ? base * 1.4 : base;
    }

    function pyramidBounds(layerIdx, widthScale){
      const scale = widthScale != null ? widthScale : 1;
      const w = pyramidWidth(layerIdx) * scale;
      return { x0: CX - w / 2, x1: CX + w / 2, w };
    }

    function registerLayer(layerIdx, yTop, height, title, subtitle, widthScale){
      const b = pyramidBounds(layerIdx, widthScale);
      layoutGeom.layers.push({ x: b.x0, y: yTop, w: b.w, h: height, rx: LAYER_RX });
      layoutGeom.bandTexts.push({ x: b.x0 + 34, y: yTop + 22, text: title, cls: 'bandLabel' });
      layoutGeom.bandTexts.push({ x: b.x0 + 34, y: yTop + 42, text: subtitle, cls: 'bandSub' });
      return { ...b, yTop, yBottom: yTop + height };
    }

    layoutGeom.layers = [];
    layoutGeom.bandTexts = [];
    layoutGeom.sections = [];
    ensureSectionHubNodes();

    if(state.graphDetail === 'collapsed'){
      const summaryLayerW = 0.5;
      const summaryLlmLayerW = 0.64;
      let y = 40;
      const h0 = Math.max(124, 88 + ROW_LLM);
      const L0 = registerLayer(0, y, h0, 'LLM Providers', 'Model interfaces above the user', summaryLlmLayerW);
      const llmY = L0.yTop + 58 + ROW_LLM / 2;
      llmAssignFixedGap(data.llms, L0.x0 + 20, L0.x1 - 20, llmY, 10);
      y = L0.yBottom + LAYER_GAP;

      const memN = data.memories.length;
      const h1 = Math.max(372, memN > 0 ? 436 : 368);
      const L1 = registerLayer(1, y, h1, 'User', 'Identity and memory ring', summaryLayerW);
      data.user.x = CX;
      data.user.y = L1.yTop + h1 / 2 + 6;
      y = L1.yBottom + LAYER_GAP;

      const personalHubIds = ['hub-pers-people','hub-pers-projects','hub-pers-meetings','hub-pers-documents'];
      const enterpriseHubIds = ['hub-ent-teams','hub-ent-edocs','hub-ent-partners','hub-ent-datasources'];
      const persLabels = ['People','Projects','Meetings','Documents'];
      const entLabels = ['Teams','Enterprise docs','Partners','Data sources + tools'];

      const h2 = 56 + SEC_GRID_TOP + ROW_RECT + 44;
      const L2 = registerLayer(2, y, h2, 'Personal Knowledge Graph', 'People, projects, meetings, and active docs', summaryLayerW);
      const gLeft2 = L2.x0 + LABEL_COL_W;
      const gRight2 = L2.x1 - INNER_PAD_R;
      const colPW = (gRight2 - gLeft2) / personalHubIds.length;
      personalHubIds.forEach((hid, i) => {
        const hn = nodeById[hid];
        if(!hn) return;
        hn.x = gLeft2 + colPW * (i + 0.5);
        hn.y = L2.yTop + 56 + SEC_GRID_TOP + ROW_RECT / 2;
        layoutGeom.sections.push({ x: hn.x - 40, y: L2.yTop + 56 + SEC_LABEL_TOP, label: persLabels[i] });
      });
      y = L2.yBottom + LAYER_GAP;

      const h3 = 56 + SEC_GRID_TOP + ROW_RECT + 48;
      const L3 = registerLayer(3, y, h3, 'Enterprise Knowledge Graph', 'Teams, enterprise docs, partners, data sources, and tool clusters', summaryLayerW);
      const gLeft3 = L3.x0 + LABEL_COL_W;
      const gRight3 = L3.x1 - INNER_PAD_R;

      enterpriseHubIds.forEach((hid, i) => {

        layoutGeom.sections.push({ x: hn.x - 48, y: L3.yTop + 56 + SEC_LABEL_TOP, label: entLabels[i] });
      });

      const horizPad = 140;
      let bandMinX = Infinity, bandMaxX = -Infinity;
      layoutGeom.layers.forEach(L => {
        bandMinX = Math.min(bandMinX, L.x);
        bandMaxX = Math.max(bandMaxX, L.x + L.w);
      });
      layoutGeom.viewBoxX = Math.floor(bandMinX - horizPad);
      layoutGeom.viewBoxW = Math.ceil(bandMaxX - bandMinX + 2 * horizPad);
      layoutGeom.viewHeight = Math.max(900, y + h3 + 72);

    }

    let y = 40;

    const h0 = Math.max(124, 88 + ROW_LLM);

    const llmY = L0.yTop + 58 + ROW_LLM / 2;
    llmAssignFixedGap(data.llms, L0.x0 + 40, L0.x1 - 40, llmY);
    y = L0.yBottom + LAYER_GAP;

    const memN = data.memories.length;
    const h1 = Math.max(498, memN > 0 ? 528 : 384);
    const L1 = registerLayer(1, y, h1, 'User', 'Identity and memory ring');
    data.user.x = CX;
    data.user.y = L1.yTop + h1 / 2 + 6;
    data.memories.forEach((n,i)=>{
      const angle = (-Math.PI / 2) + (i / Math.max(1, memN)) * Math.PI * 2;
      n.x = data.user.x + Math.cos(angle) * 220;
      n.y = data.user.y + Math.sin(angle) * 160;

    const writingNode = nodeById[WRITING_CONTEXT_ID];
    if(writingNode){
      writingNode.x = data.user.x;
      writingNode.y = data.user.y + 152;
    }
    y = L1.yBottom + LAYER_GAP;

    const personalSections = [
      { list: data.people, label: 'People' },
      { list: data.projects, label: 'Projects' },
      { list: data.meetings, label: 'Meetings' },
      { list: data.documents, label: 'Documents' }
    ];
    let innerPersonal = 56;
    personalSections.forEach(sec => {
      const c = colsForCount(sec.list.length);
      innerPersonal += sec.list.length
        ? SEC_GRID_TOP + gridBlockHeight(sec.list.length, c, ROW_RECT) + SECTION_GAP
        : 36;
    });
    const h2 = innerPersonal + 36;
    const L2 = registerLayer(2, y, h2, 'Personal Knowledge Graph', 'People, projects, meetings, and active docs');
    let yc = L2.yTop + 56;
    const gLeft2 = L2.x0 + LABEL_COL_W;
    const gRight2 = L2.x1 - INNER_PAD_R;
    personalSections.forEach(sec => {
      layoutGeom.sections.push({ x: L2.x0 + 28, y: yc + SEC_LABEL_TOP, label: sec.label });
      const c = colsForCount(sec.list.length);
      if(sec.list.length){
        gridAssignPacked(sec.list, gLeft2, gRight2, yc + SEC_GRID_TOP, ROW_RECT, c);
        yc += SEC_GRID_TOP + gridBlockHeight(sec.list.length, c, ROW_RECT) + SECTION_GAP;
      } else {
        yc += 36;
      }
    });
    y = L2.yBottom + LAYER_GAP;

    const enterpriseSections = [
      { list: data.orgNodes, label: 'Teams', rowStep: ROW_RECT, extra: 0 },
      { list: data.enterpriseDocuments, label: 'Enterprise docs', rowStep: ROW_RECT, extra: 0 },
      { list: data.partners, label: 'Partners', rowStep: ROW_RECT, extra: 0 },
      { list: data.dataSources, label: 'Data sources + tools', rowStep: DS_ROW, extra: TOOL_HALO }
    ];
    let innerEnt = 56;
    enterpriseSections.forEach(sec => {
      const c = colsForCount(sec.list.length);
      const rs = sec.rowStep;
      const ex = sec.extra || 0;
      innerEnt += sec.list.length
        ? SEC_GRID_TOP + gridBlockHeight(sec.list.length, c, rs) + ex + SECTION_GAP
        : 36;
    });
    const h3 = innerEnt + 40;
    const L3 = registerLayer(3, y, h3, 'Enterprise Knowledge Graph', 'Teams, enterprise docs, partners, data sources, and tool clusters');
    yc = L3.yTop + 56;
    const gLeft3 = L3.x0 + LABEL_COL_W;
    const gRight3 = L3.x1 - INNER_PAD_R;
    enterpriseSections.forEach(sec => {

    });

    data.dataSources.forEach(ds=>{
      const tools = data.actions.filter(n => n.parent === ds.id);
      const angles = [-90,-28,28,90,152,208];
      const radiusX = 112;
      const radiusY = 92;
      tools.forEach((tool,i)=>{
        if(tool.id === WRITING_CONTEXT_ID) return;
        const angle = (angles[i % angles.length] * Math.PI) / 180;
        tool.x = ds.x + Math.cos(angle) * radiusX;
        tool.y = ds.y + Math.sin(angle) * radiusY;
      });
    });

    const horizPad = 140;
    let bandMinX = Infinity, bandMaxX = -Infinity;
    layoutGeom.layers.forEach(L => {
      bandMinX = Math.min(bandMinX, L.x);
      bandMaxX = Math.max(bandMaxX, L.x + L.w);
    });
    layoutGeom.viewBoxX = Math.floor(bandMinX - horizPad);
    layoutGeom.viewBoxW = Math.ceil(bandMaxX - bandMinX + 2 * horizPad);
    layoutGeom.viewHeight = Math.max(900, y + h3 + 72);
  }

  function svgEl(name, attrs={}){
    const n = document.createElementNS('http://www.w3.org/2000/svg', name);
    Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k, String(v)));
    return n;
  }

  function fillList(elm, items){
    clearElement(elm);

      li.textContent = text;
      elm.appendChild(li);

      class:cls
    }));

  function clampLabel(str){
    const s = String(str || '').replace(/\s+/g,' ').trim();
    return s.length > 50 ? s.slice(0,49) + '…' : s;
  }

  function wrapLabel(str,maxChars=16,maxLines=3){
    const safe = clampLabel(str);
    if(!safe) return [''];
    const words = safe.split(' ');
    const lines = [];
    let current = '';

    words.forEach(word => {
      const candidate = current ? `${current} ${word}` : word;
      if(candidate.length <= maxChars){
        current = candidate;
      } else {
        if(current) lines.push(current);
        current = word.length > maxChars ? word.slice(0, maxChars - 1) + '…' : word;
      }
    });

    if(current) lines.push(current);
    if(lines.length > maxLines){
      const kept = lines.slice(0, maxLines);
      const last = kept[maxLines - 1];
      kept[maxLines - 1] = last.endsWith('…') ? last : `${last.slice(0, Math.max(0, maxChars - 1))}…`;
      return kept;
    }
    return lines;
  }

  function appendTextLines(group, lines, x, y, className, lineHeight){
    const text = svgEl('text',{x,y,class:className});
    lines.forEach((line,idx) => {
      const tspan = svgEl('tspan',{x,dy: idx === 0 ? 0 : lineHeight});
      tspan.textContent = line;
      text.appendChild(tspan);
    });
    group.appendChild(text);
    return text;
  }

  function drawLayers(){
    const g = svgEl('g');
    layoutGeom.layers.forEach(L => {
      g.appendChild(svgEl('rect',{
        x: L.x,
        y: L.y,
        width: L.w,
        height: L.h,
        rx: L.rx != null ? L.rx : 28,
        class: 'layerBand'
      }));
    });
    layoutGeom.bandTexts.forEach(b => {
      const t = svgEl('text', { x: b.x, y: b.y, class: b.cls });
      t.textContent = b.text;
      g.appendChild(t);
    });
    return g;
  }

  function drawSectionLabels(g){
    layoutGeom.sections.forEach(s => {
      const t = svgEl('text', { x: s.x, y: s.y, class: 'sectionLabel' });
      t.textContent = s.label;
      g.appendChild(t);
    });
  }

  function nodeSize(node){
    if(node.kind==='user') return {r:56};
    if(node.kind==='memory') return {r:28};
    if(node.kind==='sectionHub') return {w:200,h:74,rect:true};
    if(node.kind==='llm') return {w:LLM_NODE_RECT_W,h:62,rect:true};
    if(node.kind==='datasource') return {r:34};
    if(node.kind==='tool') return {w:124,h:56,rect:true};
    if(node.kind==='doc') return {w:162,h:68,rect:true};
    if(['team','partner','project','meeting','person'].includes(node.kind)) return {w:172,h:68,rect:true};
    return {r:24};
  }

  function drawNode(node){
    const g = svgEl('g',{class:`node ${node.kind}${state.selected===node.id ? ' selected' : ''}`});
    g.addEventListener('click', evt => {
      evt.stopPropagation();
      state.selected = node.id;
      renderStatic({ preserveCamera: true });
    });

    const size = nodeSize(node);
    let iconX = node.x;
    let iconY = node.y;

    if(size.rect){
      g.appendChild(svgEl('rect',{
        x:node.x-size.w/2,
        y:node.y-size.h/2,
        width:size.w,
        height:size.h,
        rx:14,
        class:'shape'
      }));
      iconX = node.x - size.w/2 + 18;
      iconY = node.y - 10;
    } else {
      g.appendChild(svgEl('circle',{cx:node.x,cy:node.y,r:size.r,class:'shape'}));
    }

    g.appendChild(iconGroup(node.icon || 'circle', iconX, iconY, size.rect ? 20 : 24));

    if(size.rect){
      const lw = node.kind === 'tool' ? 14 : node.kind === 'sectionHub' ? 12 : 17;
      const lines = wrapLabel(node.label, lw, 3);
      appendTextLines(g, lines, node.x + 12, node.y + (lines.length === 1 ? 6 : -8), 'nodeLabel', 18);
    } else if(node.kind === 'user'){
      appendTextLines(g, wrapLabel(node.label, 18, 2), node.x, node.y + 82, 'nodeLabel', 18);
      appendTextLines(g, wrapLabel(node.subtitle || '', 28, 2), node.x, node.y + 112, 'nodeLabelSub', 16);
    } else {
      appendTextLines(g, wrapLabel(node.label, 18, 2), node.x, node.y + 50, 'nodeLabel', 18);
    }

    return g;
  }

  function edgePath(a,b){
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const cx = a.x + dx / 2;
    const cy = a.y + dy / 2;
    const curve = Math.abs(dx) > 180 ? 20 : 8;
    return `M ${a.x} ${a.y} Q ${cx} ${cy - curve} ${b.x} ${b.y}`;
  }

  function setNodeDetailPopoverVisible(visible){
    if(!nodeDetailPopover) return;
    nodeDetailPopover.classList.toggle('isHidden', !visible);
    nodeDetailPopover.setAttribute('aria-hidden', visible ? 'false' : 'true');
  }

  function fillNodeDetailPopover(node){
    if(!detailTitle || !detailMeta || !detailConnections || !detailRelated) return;
    detailTitle.textContent = node.label;

    const meta = [];
    if(node.kind) meta.push(`Type: ${node.kind}`);
    if(node.layer) meta.push(`Layer: ${node.layer}`);
    if(node.group) meta.push(`Group: ${node.group}`);
    if(node.parent) meta.push(`Parent datasource: ${nodeById[node.parent] ? nodeById[node.parent].label : node.parent}`);
    fillList(detailMeta, meta.length ? meta : ['No metadata available.']);

    const direct = currentVisibleEdges
      .filter(e => e.a===node.id || e.b===node.id)
      .map(e => {
        const other = nodeById[e.a===node.id ? e.b : e.a];
        return `${e.type}: ${other ? other.label : (e.a===node.id ? e.b : e.a)}`;
      });

    fillList(detailConnections, direct.length ? direct.slice(0,20) : ['No direct connections visible in this view.']);
    fillList(detailRelated, [...new Set(direct.map(x => x.split(': ')[1]).filter(Boolean))].slice(0,20));
  }

  function syncNodeDetailPopover(){
    if(state.selected && nodeById[state.selected]){
      fillNodeDetailPopover(nodeById[state.selected]);
      setNodeDetailPopoverVisible(true);
    } else {
      setNodeDetailPopoverVisible(false);
    }
  }

  function ensureViewport(){
    clearElement(svg);
    viewport = svgEl('g');
    staticGroup = svgEl('g');
    travelerGroup = svgEl('g');
    viewport.appendChild(staticGroup);
    viewport.appendChild(travelerGroup);
    svg.appendChild(viewport);
    applyCamera();
  }

  function applyCamera(){
    if(!viewport) return;
    viewport.setAttribute('transform', `translate(${state.camera.x} ${state.camera.y}) scale(${state.camera.scale})`);
    hudCamera.textContent = `${Math.round(state.camera.scale * 100)}% · drag to pan · wheel to zoom`;
  }

  function fitCameraToGraph(){
    const rect = svg.getBoundingClientRect();
    if(rect.width < 8 || rect.height < 8) return;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    currentVisibleNodes.forEach(n => {
      const sz = nodeSize(n);
      const padX = (sz.rect ? sz.w / 2 : sz.r) + 32;
      const padY = (sz.rect ? sz.h / 2 : sz.r) + 52;
      minX = Math.min(minX, n.x - padX);
      maxX = Math.max(maxX, n.x + padX);
      minY = Math.min(minY, n.y - padY);
      maxY = Math.max(maxY, n.y + padY);
    });
    if(!isFinite(minX)){
      const vbH = state.view === 'glean' ? layoutGeom.viewHeight : 3300;
      const vbX = state.view === 'glean' ? layoutGeom.viewBoxX : 0;
      const vbW = state.view === 'glean' ? layoutGeom.viewBoxW : 2000;
      minX = vbX; maxX = vbX + vbW; minY = 0; maxY = vbH;
    } else {
      const pad = 64;
      minX -= pad; maxX += pad; minY -= pad; maxY += pad;
    }
    if(state.view === 'glean'){
      state.camera.scale = Math.min(GLEAN_CAMERA_MAX_SCALE, GLEAN_CAMERA_START_SCALE);
    } else {
      state.camera.scale = COMPETITOR_CAMERA_START_SCALE;
    }
    const cx = (minX + maxX) / 2;
    const cy = (minY + maxY) / 2;
    let viewCx, viewCy;
    if(state.view === 'glean'){
      viewCx = layoutGeom.viewBoxX + layoutGeom.viewBoxW / 2;
      viewCy = layoutGeom.viewHeight / 2;
    } else {
      const vb = svg.viewBox && svg.viewBox.baseVal;
      viewCx = vb && vb.width > 0 ? vb.x + vb.width / 2 : cx;
      viewCy = vb && vb.height > 0 ? vb.y + vb.height / 2 : cy;
    }
    state.camera.x = viewCx - cx * state.camera.scale;
    state.camera.y = viewCy - cy * state.camera.scale;
  }

  function renderStatic(opts = {}){
    currentVisibleNodes = visibleNodes();
    layout();
    currentVisibleEdges = visibleEdges();

    pageTitle.textContent = data.meta.title || `${data.user.label} Enterprise Knowledge Graph`;

    hudMode.textContent = `Mode: ${state.view==='glean' ? "Glean's Context" : "Competitor's Context"}`;
    if(graphDetailWrap){
      graphDetailWrap.classList.toggle('isHidden', state.view !== 'glean');
    }
    if(btnGraphCollapsed && btnGraphExpanded){
      btnGraphCollapsed.classList.toggle('active', state.graphDetail === 'collapsed');
      btnGraphExpanded.classList.toggle('active', state.graphDetail === 'expanded');
    }
    hudCounts.textContent = `${currentVisibleNodes.length} nodes · ${currentVisibleEdges.length} edges`;

    if(state.view === 'glean'){
      svg.setAttribute('viewBox', `${layoutGeom.viewBoxX} 0 ${layoutGeom.viewBoxW} ${Math.ceil(layoutGeom.viewHeight)}`);
    } else {
      let cminX = Infinity, cminY = Infinity, cmaxX = -Infinity, cmaxY = -Infinity;
      currentVisibleNodes.forEach(n => {
        const sz = nodeSize(n);
        const padX = (sz.rect ? sz.w / 2 : sz.r) + 28;
        const padY = (sz.rect ? sz.h / 2 : sz.r) + 40;
        cminX = Math.min(cminX, n.x - padX);
        cmaxX = Math.max(cmaxX, n.x + padX);
        cminY = Math.min(cminY, n.y - padY);
        cmaxY = Math.max(cmaxY, n.y + padY);
      });
      if(isFinite(cminX)){
        const vbM = 48;
        cminX -= vbM; cmaxX += vbM; cminY -= vbM; cmaxY += vbM;
        svg.setAttribute('viewBox', `${cminX} ${cminY} ${cmaxX - cminX} ${cmaxY - cminY}`);
      } else {
        svg.setAttribute('viewBox', '0 0 2000 3300');
      }
    }

    ensureViewport();
    clearElement(staticGroup);

    if(state.view==='glean'){
      staticGroup.appendChild(drawLayers());
      drawSectionLabels(staticGroup);

      if(data.memories.length || nodeById[WRITING_CONTEXT_ID]){
        const ringR = state.graphDetail === 'collapsed' ? 148 : 226;
        staticGroup.appendChild(svgEl('circle',{cx:data.user.x,cy:data.user.y,r:ringR,class:'memoryRing'}));
        if(data.memories.length){
          const ringLabel = svgEl('text',{x:data.user.x-110,y:data.user.y-ringR-28,class:'ringLabel'});
          ringLabel.textContent = 'User Memories';
          staticGroup.appendChild(ringLabel);
        }
      }
    }

    const edgeGroup = svgEl('g');
    currentVisibleEdges.forEach(edge => {
      const a = nodeById[edge.a];
      const b = nodeById[edge.b];
      if(!a || !b) return;
      const path = svgEl('path',{d:edgePath(a,b),class:`edge ${edge.type}`});
      if(edge.type === 'tool') path.setAttribute('class', 'sunRay');
      edgeGroup.appendChild(path);
    });
    staticGroup.appendChild(edgeGroup);

    const nodeGroup = svgEl('g');
    currentVisibleNodes.forEach(node => nodeGroup.appendChild(drawNode(node)));
    staticGroup.appendChild(nodeGroup);

    syncNodeDetailPopover();

    travelerGeomStale = true;
    if(!opts.preserveCamera){
      fitCameraToGraph();
      const r0 = svg.getBoundingClientRect();
      if(r0.width < 8 || r0.height < 8){
        (function deferFit(attempts){
          if(attempts <= 0) return;
          requestAnimationFrame(() => {
            const r = svg.getBoundingClientRect();
            if(r.width >= 8 && r.height >= 8){
              fitCameraToGraph();
              applyCamera();
            } else deferFit(attempts - 1);
          });
        })(16);
      }
    }
    renderTravelers();
    applyCamera();
  }

  function renderTravelers(){
    if(!travelerGroup) return;
    clearElement(travelerGroup);

    if(travelerViewMode !== state.view || travelerGraphDetail !== state.graphDetail){
      gleanTravelers = null;
      competitorTravelers = null;
      travelerViewMode = state.view;
      travelerGraphDetail = state.graphDetail;
    }

    if(travelerGeomStale){
      if(state.view === 'glean' && gleanTravelers){
        gleanTravelers.forEach(tr => { tr.geom = pathGeomFromIds(tr.pathIds); });
      } else if(state.view === 'competitor' && competitorTravelers){
        competitorTravelers.forEach(tr => { tr.geom = pathGeomFromIds(tr.pathIds); });
      }
      travelerGeomStale = false;
    }

    const now = performance.now();

    if(state.view === 'competitor'){
      if(!competitorTravelers){
        competitorTravelers = [];
        for(let i = 0; i < COMPETITOR_TRAVELER_COUNT; i++) competitorTravelers.push(createCompetitorTraveler(now));
      }
      competitorTravelers.forEach(tr => {
        const pos = sampleTravelerMotion(tr, now);
        travelerGroup.appendChild(svgEl('circle',{
          cx: pos.x,
          cy: pos.y,
          r: 4.8,
          class: pos.cls
        }));
      });
      return;
    }

    if(!gleanTravelers){
      gleanTravelers = [];
      for(let i = 0; i < GLEAN_TRAVELER_COUNT; i++) gleanTravelers.push(createGleanTraveler(now));
    }

    gleanTravelers.forEach(tr => {
      const pos = sampleTravelerMotion(tr, now);
      travelerGroup.appendChild(svgEl('circle',{
        cx: pos.x,
        cy: pos.y,
        r: 3.5,
        class: pos.cls
      }));
    });
  }

  function svgPointFromEvent(evt){
    const pt = svg.createSVGPoint();
    pt.x = evt.clientX;
    pt.y = evt.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }

  svg.addEventListener('pointerdown', evt => {
    const clickedNode = typeof evt.target.closest === 'function' && evt.target.closest('.node');
    if(clickedNode) return;
    state.isPanning = true;
    stageWrap.classList.add('dragging');
    state.panStart = {
      point: svgPointFromEvent(evt),
      x: state.camera.x,
      y: state.camera.y
    };
    svg.setPointerCapture(evt.pointerId);
  });

  svg.addEventListener('pointermove', evt => {
    if(!state.isPanning || !state.panStart) return;
    const p = svgPointFromEvent(evt);
    state.camera.x = state.panStart.x + (p.x - state.panStart.point.x);
    state.camera.y = state.panStart.y + (p.y - state.panStart.point.y);
    applyCamera();
  });

  function endPan(evt){
    state.isPanning = false;
    state.panStart = null;
    stageWrap.classList.remove('dragging');
    if(evt && svg.hasPointerCapture && svg.hasPointerCapture(evt.pointerId)){
      svg.releasePointerCapture(evt.pointerId);
    }
  }

  svg.addEventListener('pointerup', endPan);
  svg.addEventListener('pointercancel', endPan);

  svg.addEventListener('wheel', evt => {
    evt.preventDefault();
    const p = svgPointFromEvent(evt);
    const worldX = (p.x - state.camera.x) / state.camera.scale;
    const worldY = (p.y - state.camera.y) / state.camera.scale;
    const factor = evt.deltaY < 0 ? 1.1 : 0.9;
    const minS = state.view === 'glean' ? GLEAN_CAMERA_MIN_SCALE : 0.55;
    const maxS = state.view === 'glean' ? GLEAN_CAMERA_MAX_SCALE : 2.6;
    const newScale = Math.max(minS, Math.min(maxS, state.camera.scale * factor));
    state.camera.x = p.x - worldX * newScale;
    state.camera.y = p.y - worldY * newScale;
    state.camera.scale = newScale;
    applyCamera();
  }, {passive:false});

  svg.addEventListener('click', evt => {
    const clickedNode = typeof evt.target.closest === 'function' && evt.target.closest('.node');
    if(clickedNode) return;
    state.selected = null;
    renderStatic({ preserveCamera: true });
  });

  btnGlean.addEventListener('click', () => {
    state.view = 'glean';
    state.selected = null;
    btnGlean.classList.add('active');
    btnCompetitor.classList.remove('active');
    renderStatic();
  });

  btnCompetitor.addEventListener('click', () => {
    state.view = 'competitor';
    state.selected = null;
    btnCompetitor.classList.add('active');
    btnGlean.classList.remove('active');
    renderStatic();
  });

  if(btnGraphCollapsed){
    btnGraphCollapsed.addEventListener('click', () => {
      if(state.view !== 'glean' || state.graphDetail === 'collapsed') return;
      state.graphDetail = 'collapsed';
      state.selected = null;
      renderStatic();
    });
  }
  if(btnGraphExpanded){
    btnGraphExpanded.addEventListener('click', () => {
      if(state.view !== 'glean' || state.graphDetail === 'expanded') return;
      state.graphDetail = 'expanded';
      state.selected = null;
      renderStatic();
    });
  }

  btnReset.addEventListener('click', () => {
    state.selected = null;
    renderStatic();
  });

  if(nodeDetailClose){
    nodeDetailClose.addEventListener('click', () => {
      state.selected = null;
      renderStatic({ preserveCamera: true });
    });
  }

  function animate(){
    renderTravelers();
    requestAnimationFrame(animate);
  }

  renderStatic();
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
